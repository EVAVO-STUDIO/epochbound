name: Apply README schema consistency fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Correct stale schema reference
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          source = path.read_text(encoding="utf-8")
          old = "Save schema 3 restores exact wallet balances, finite stock and dynamically resold goods, while State Studio exposes dedicated Wallet and Merchant Stock inspectors."
          new = "Save schema 4 restores exact wallet balances, finite stock, dynamically resold goods and loaded magazines, while State Studio exposes dedicated Wallet, Merchant Stock and Loaded Ammo inspectors."
          if source.count(old) != 1:
              raise SystemExit("README stale schema sentence was not found exactly once")
          path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

      - name: Commit README correction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: align economy overview with save schema 4"
          git push origin HEAD:main
