name: Align inherited smoke tests with inventory runtime

on:
  push:
    branches:
      - work/item-forge-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Extend runtime-path acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/item-forge-foundation-20260729

      - name: Apply exact inherited test changes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "tools/smoke_encounters.gd": [
                  (
                      '\t"res://src/companion_runtime.gd"\n]',
                      '\t"res://src/companion_runtime.gd",\n\t"res://src/inventory_runtime.gd"\n]',
                  )
              ],
              "tools/smoke_combat_director.gd": [
                  (
                      'runtime_path in ["res://src/combat_director_runtime.gd", "res://src/companion_runtime.gd"]',
                      'runtime_path in ["res://src/combat_director_runtime.gd", "res://src/companion_runtime.gd", "res://src/inventory_runtime.gd"]',
                  )
              ],
              "tools/smoke_companion_director.gd": [
                  (
                      'str((script_value as GDScript).resource_path) == "res://src/companion_runtime.gd",',
                      'str((script_value as GDScript).resource_path) in ["res://src/companion_runtime.gd", "res://src/inventory_runtime.gd"],',
                  ),
                  (
                      '"Runtime scene must bind the companion runtime."',
                      '"Runtime scene must bind a companion-capable runtime."',
                  )
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              source = path.read_text(encoding="utf-8")
              for old, new in edits:
                  if source.count(old) != 1:
                      raise SystemExit(f"Expected one reviewed occurrence in {filename}: {old!r}")
                  source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8", newline="\n")

          Path(".github/workflows/apply-inventory-runtime-test-paths.yml").unlink()

      - name: Commit inherited test alignment
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/smoke_encounters.gd tools/smoke_combat_director.gd tools/smoke_companion_director.gd .github/workflows/apply-inventory-runtime-test-paths.yml
          git commit -m "test: accept inventory runtime in inherited smoke tests"
          git push origin HEAD:work/item-forge-foundation-20260729
