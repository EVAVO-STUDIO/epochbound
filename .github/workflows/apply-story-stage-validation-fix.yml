name: Validate malformed quest stages comprehensively

on:
  push:
    branches:
      - work/story-studio-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Preserve malformed stages for nested validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/story-studio-foundation-20260729

      - name: Apply exact stage-validation changes
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/content/story_validator.gd")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '\tvar stage_ids: Dictionary = {}\n\tfor stage_value in stages:\n',
                  '\tvar stage_ids: Dictionary = {}\n\tvar stage_records: Array[Dictionary] = []\n\tfor stage_value in stages:\n',
              ),
              (
                  '\t\tvar stage_data: Dictionary = stage_value\n\t\tvar stage_id := str(stage_data.get("id", ""))\n',
                  '\t\tvar stage_data: Dictionary = stage_value\n\t\tstage_records.append(stage_data)\n\t\tvar stage_id := str(stage_data.get("id", ""))\n',
              ),
              (
                  '\tvar outgoing: Dictionary = {}\n\tfor stage_id in stage_ids.keys():\n\t\tvar stage_data: Dictionary = stage_ids[stage_id]\n\t\tvar stage_prefix := "%s/stage/%s" % [prefix, stage_id]\n',
                  '\tvar outgoing: Dictionary = {}\n\tfor stage_data in stage_records:\n\t\tvar stage_id := str(stage_data.get("id", ""))\n\t\tvar stage_prefix := "%s/stage/%s" % [prefix, stage_id if not stage_id.is_empty() else "stage"]\n',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"Expected one reviewed stage-validation block, found {source.count(old)}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8", newline="\n")
          Path(".github/workflows/apply-story-stage-validation-fix.yml").unlink()

      - name: Commit stage validation fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/story_validator.gd .github/workflows/apply-story-stage-validation-fix.yml
          git commit -m "fix: validate nested fields on malformed quest stages"
          git push origin HEAD:work/story-studio-foundation-20260729
