name: Apply Story Studio non-logging parser fix

on:
  push:
    branches:
      - work/story-studio-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Replace parse_string with parser instances
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/story-studio-foundation-20260729

      - name: Apply exact parser changes
        shell: python
        run: |
          from pathlib import Path

          path = Path("addons/epochbound_story_studio/story_studio.gd")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '''\t\tvar value: Variant = JSON.parse_string(line)\n\t\tif typeof(value) != TYPE_DICTIONARY:\n\t\t\terrors.append("%s line %d must be one valid JSON object." % [label, line_number])\n\t\t\tcontinue\n\t\tentries.append(value)\n''',
                  '''\t\tvar parser := JSON.new()\n\t\tvar parse_error := parser.parse(line)\n\t\tif parse_error != OK or typeof(parser.data) != TYPE_DICTIONARY:\n\t\t\terrors.append("%s line %d must be one valid JSON object." % [label, line_number])\n\t\t\tcontinue\n\t\tentries.append(parser.data)\n''',
              ),
              (
                  '''\tif trimmed.begins_with("{"):\n\t\tvar parsed: Variant = JSON.parse_string(trimmed)\n\t\tif typeof(parsed) != TYPE_DICTIONARY:\n\t\t\treturn {"ok": false, "value": "", "errors": ["%s must be plain text or one valid JSON object." % label]}\n\t\treturn {"ok": true, "value": parsed, "errors": []}\n''',
                  '''\tif trimmed.begins_with("{"):\n\t\tvar parser := JSON.new()\n\t\tvar parse_error := parser.parse(trimmed)\n\t\tif parse_error != OK or typeof(parser.data) != TYPE_DICTIONARY:\n\t\t\treturn {"ok": false, "value": "", "errors": ["%s must be plain text or one valid JSON object." % label]}\n\t\treturn {"ok": true, "value": parser.data, "errors": []}\n''',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"Expected one reviewed parser block, found {source.count(old)}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8", newline="\n")
          Path(".github/workflows/apply-story-parser-fix.yml").unlink()

      - name: Commit parser fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons/epochbound_story_studio/story_studio.gd .github/workflows/apply-story-parser-fix.yml
          git commit -m "fix: reject malformed Story Studio source without engine errors"
          git push origin HEAD:work/story-studio-foundation-20260729
