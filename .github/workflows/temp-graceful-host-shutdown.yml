name: Temporary Graceful Host Shutdown Integration

on:
  push:
    branches:
      - agent/graceful-host-shutdown

permissions:
  contents: write

concurrency:
  group: epochbound-temp-graceful-host-shutdown
  cancel-in-progress: false

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
      GODOT_BINARY: Godot_v4.6.2-stable_linux.x86_64
      GODOT_RELEASE_URL: https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable

    steps:
      - name: Check out exact branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic host shutdown integration
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 tools/temp_apply_graceful_host_shutdown.py \
            > "${RUNNER_TEMP}/host-shutdown-apply.log" 2>&1
          apply_status=$?
          set -e
          cat "${RUNNER_TEMP}/host-shutdown-apply.log"
          if [[ ${apply_status} -ne 0 ]]; then
            echo "Applicator stopped at protected workflow schema bookkeeping; completing that deterministic edit separately."
          fi
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/validate.yml")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              '# Receipt schema migrated from: "schemaVersion": "2.4"',
              '# Receipt schema migrated from: "schemaVersion": "2.5"',
          )
          source = source.replace(
              '              "schemaVersion": "2.5",',
              '              "schemaVersion": "2.6",',
          )
          marker = '              "multiplayerLoopbackValidation": "passed",\n'
          addition = marker + '              "multiplayerHostShutdownValidation": "passed",\n'
          if '"multiplayerHostShutdownValidation": "passed"' not in source:
              if source.count(marker) != 1:
                  raise SystemExit("exact-main host-shutdown receipt anchor drifted")
              source = source.replace(marker, addition, 1)
          required = [
              '# Receipt schema migrated from: "schemaVersion": "2.5"',
              '              "schemaVersion": "2.6",',
              '"multiplayerHostShutdownValidation": "passed"',
          ]
          for token in required:
              if token not in source:
                  raise SystemExit(f"exact-main workflow is missing {token}")
          path.write_text(source, encoding="utf-8")
          PY
          git diff --check

      - name: Run all fail-closed source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/*.py
          rm -rf tools/__pycache__
          python3 tools/check_release_workflow_policy.py
          for checker in tools/check_*_contract.py; do
            python3 "$checker"
          done

      - name: Download and verify official Godot 4.6.2 editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin .godot-download
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output .godot-download/SHA512-SUMS.txt \
            "${GODOT_RELEASE_URL}/SHA512-SUMS.txt"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output ".godot-download/${GODOT_ARCHIVE}" \
            "${GODOT_RELEASE_URL}/${GODOT_ARCHIVE}"
          grep -F "  ${GODOT_ARCHIVE}" .godot-download/SHA512-SUMS.txt \
            > .godot-download/selected-SHA512-SUMS.txt
          (cd .godot-download && sha512sum --check selected-SHA512-SUMS.txt)
          unzip -q ".godot-download/${GODOT_ARCHIVE}" -d .godot-bin
          mv ".godot-bin/${GODOT_BINARY}" .godot-bin/godot
          chmod +x .godot-bin/godot
          version="$(.godot-bin/godot --version)"
          [[ "${version}" =~ ^4\.6\.2 ]] || { echo "Unexpected Godot version: ${version}" >&2; exit 1; }
          command -v pwsh >/dev/null || { echo "PowerShell is required" >&2; exit 1; }
          rm -rf .godot-download

      - name: Run complete leak-free seventeen-system validation gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE/scripts/validate.ps1" `
            -GodotExecutable "$env:GITHUB_WORKSPACE/.godot-bin/godot"

      - name: Run real ENet reconnect and host shutdown gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE/scripts/validate_multiplayer_loopback.ps1" `
            -GodotExecutable "$env:GITHUB_WORKSPACE/.godot-bin/godot" `
            -ProjectRoot "$env:GITHUB_WORKSPACE"

      - name: Verify and publish intentional non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only > "${RUNNER_TEMP}/changed-files.txt"
          grep -v '^\.github/workflows/validate\.yml$' "${RUNNER_TEMP}/changed-files.txt" \
            > "${RUNNER_TEMP}/publish-files.txt"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          allowed_exact = {
              ".github/workflows/validate.yml",
              "README.md",
              "docs/MULTIPLAYER_COOP_PVP.md",
              "docs/MULTIPLAYER_LOOPBACK_GATE.md",
              "scripts/validate.ps1",
              "scripts/validate_multiplayer_loopback.ps1",
              "src/multiplayer_transport_session.gd",
              "tools/check_multiplayer_loopback_contract.py",
              "tools/check_release_workflow_policy.py",
              "tools/multiplayer_loopback_peer.gd",
              "tools/multiplayer_loopback_peer_driver.gd",
              "tools/smoke_multiplayer_runtime.gd",
          }
          root = Path(os.environ["RUNNER_TEMP"])
          changed = [
              line.strip()
              for line in (root / "changed-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          publish = [
              line.strip()
              for line in (root / "publish-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if not changed or not publish:
              raise SystemExit("host shutdown applicator produced no publishable source changes")
          if ".github/workflows/validate.yml" not in changed:
              raise SystemExit("validated exact-main workflow update is missing")
          required = {
              "src/multiplayer_transport_session.gd",
              "tools/multiplayer_loopback_peer.gd",
              "tools/multiplayer_loopback_peer_driver.gd",
              "tools/smoke_multiplayer_runtime.gd",
              "tools/check_multiplayer_loopback_contract.py",
              "scripts/validate_multiplayer_loopback.ps1",
              "docs/MULTIPLAYER_LOOPBACK_GATE.md",
          }
          missing = sorted(required.difference(changed))
          if missing:
              raise SystemExit("required host shutdown files are missing: " + ", ".join(missing))
          unexpected = [
              path
              for path in changed
              if path not in allowed_exact
              and re.fullmatch(r"tools/check_[a-z0-9_]+_contract\.py", path) is None
          ]
          if unexpected:
              raise SystemExit("unexpected changed files: " + ", ".join(unexpected))
          print("validated permanent changes:")
          for path in changed:
              print(f"- {path}")
          print("publishing non-workflow source through Actions:")
          for path in publish:
              print(f"- {path}")
          print("publishing protected exact-main workflow separately through the GitHub connector")
          PY
          git add --pathspec-from-file="${RUNNER_TEMP}/publish-files.txt"
          git diff --cached --check
          git config user.name "EVAVO Release Agent"
          git config user.email "evavo.studio@gmail.com"
          git commit -m "feat: add acknowledged host shutdown and clean ENet exit [skip ci]"
          git push origin HEAD:agent/graceful-host-shutdown
