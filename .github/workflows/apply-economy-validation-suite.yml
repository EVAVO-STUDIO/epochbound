name: Apply economy validation suite

on:
  push:
    branches:
      - work/merchant-economy-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Extend permanent Godot validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/merchant-economy-foundation-20260729

      - name: Apply exact regression updates
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected one occurrence, found {count}: {old!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          # Compile every new runtime/editor/validator/test entrypoint.
          replace_once(
              "tools/compile_probe.gd",
              '\t"res://src/equipment_runtime.gd",\n',
              '\t"res://src/equipment_runtime.gd",\n\t"res://src/merchant_runtime.gd",\n'
          )
          replace_once(
              "tools/compile_probe.gd",
              '\t"res://src/content/equipment_validator.gd",\n',
              '\t"res://src/content/equipment_validator.gd",\n\t"res://src/content/economy_catalog.gd",\n\t"res://src/content/economy_validator.gd",\n'
          )
          replace_once(
              "tools/compile_probe.gd",
              '\t"res://src/game/equipment_model.gd",\n',
              '\t"res://src/game/equipment_model.gd",\n\t"res://src/game/economy_model.gd",\n'
          )
          replace_once(
              "tools/compile_probe.gd",
              '\t"res://addons/epochbound_loadout_studio/plugin.gd",\n',
              '\t"res://addons/epochbound_loadout_studio/plugin.gd",\n\t"res://addons/epochbound_trade_studio/trade_studio.gd",\n\t"res://addons/epochbound_trade_studio/plugin.gd",\n'
          )
          replace_once(
              "tools/compile_probe.gd",
              '\t"res://tools/smoke_equipment_validation_edges.gd",\n',
              '\t"res://tools/smoke_equipment_validation_edges.gd",\n\t"res://tools/smoke_economy_runtime.gd",\n\t"res://tools/smoke_trade_studio.gd",\n\t"res://tools/smoke_economy_validation_edges.gd",\n'
          )
          replace_once(
              "tools/compile_probe.gd",
              'Compile probe passed: runtime, all eight editors, validators, smoke tests and critical resources load cleanly.',
              'Compile probe passed: runtime, all nine editors, validators, smoke tests and critical resources load cleanly.'
          )

          # The command-line content gate now uses the final economy-aware validator.
          replace_once(
              "tools/validate_content.gd",
              'const EquipmentValidator = preload("res://src/content/equipment_validator.gd")',
              'const EquipmentValidator = preload("res://src/content/economy_validator.gd")'
          )
          replace_once(
              "tools/validate_content.gd",
              'Content validation: %d campaign(s), %d map(s), %d object definition(s), %d placement(s), %d encounter zone(s), %d companion cue(s), %d item(s), %d recipe(s), %d conversation(s), %d quest(s), %d save policy record(s), %d equipment item(s), %d equipment slot(s), %d capability definition(s), %d capability gate(s), %d warning(s), %d error(s).',
              'Content validation: %d campaign(s), %d map(s), %d object definition(s), %d placement(s), %d encounter zone(s), %d companion cue(s), %d item(s), %d recipe(s), %d conversation(s), %d quest(s), %d save policy record(s), %d equipment item(s), %d equipment slot(s), %d capability definition(s), %d capability gate(s), %d currency definition(s), %d merchant(s), %d merchant binding(s), %d stock entry(s), %d warning(s), %d error(s).'
          )
          replace_once(
              "tools/validate_content.gd",
              '''\t\t\treport.get("capability_gate_count", 0),
          \t\t\treport.get("warnings", []).size(),
          ''',
              '''\t\t\treport.get("capability_gate_count", 0),
          \t\t\treport.get("currency_count", 0),
          \t\t\treport.get("merchant_count", 0),
          \t\t\treport.get("merchant_binding_count", 0),
          \t\t\treport.get("merchant_stock_count", 0),
          \t\t\treport.get("warnings", []).size(),
          '''
          )

          # Inherited tests now run against the merchant-aware runtime and expanded reference catalogues.
          replace_once("tools/smoke_encounters.gd", '\t"res://src/equipment_runtime.gd"\n]', '\t"res://src/equipment_runtime.gd",\n\t"res://src/merchant_runtime.gd"\n]')
          replace_once("tools/smoke_encounters.gd", '== 4, "Reference campaign must expose four reusable object definitions."', '== 6, "Reference campaign must expose six reusable object definitions."')
          replace_once("tools/smoke_encounters.gd", '== 9, "Reference campaign must expose nine object placements."', '== 11, "Reference campaign must expose eleven object placements."')
          replace_once("tools/smoke_encounters.gd", 'verdant_entities.size() == 3, "Verdant Bellweather must instantiate the crate, archivist and shard."', 'verdant_entities.size() == 4, "Verdant Bellweather must instantiate the crate, archivist, provisioner and shard."')
          replace_once("tools/smoke_encounters.gd", 'ashen_entities.size() == 2, "Ashen Bellweather must instantiate the crate and Ash Hound."', 'ashen_entities.size() == 3, "Ashen Bellweather must instantiate the crate, provisioner and Ash Hound."')
          replace_once("tools/smoke_encounters.gd", 'collected_entities.size() == 2, "Collected pickups must not respawn from the same persistent state key."', 'collected_entities.size() == 3, "Collected pickups must not respawn while persistent merchant NPCs remain."')
          replace_once("tools/smoke_encounters.gd", '(loaded_definitions as Dictionary).size() == 4, "Runtime must load the campaign object catalog during ready."', '(loaded_definitions as Dictionary).size() == 6, "Runtime must load the expanded campaign object catalog during ready."')
          replace_once("tools/smoke_encounters.gd", 'runtime_entities.size() == 2, "Runtime must resolve era-scoped Bellweather entities."', 'runtime_entities.size() == 3, "Runtime must resolve era-scoped Bellweather entities including the provisioner."')

          replace_once("tools/smoke_combat_director.gd", '== 4, "Reference object catalog must retain four definitions."', '== 6, "Reference object catalog must retain six definitions."')
          replace_once("tools/smoke_combat_director.gd", '== 9, "Reference campaign must retain nine placements."', '== 11, "Reference campaign must retain eleven placements."')
          replace_once("tools/smoke_combat_director.gd", '"res://src/equipment_runtime.gd"]', '"res://src/equipment_runtime.gd", "res://src/merchant_runtime.gd"]')
          replace_once("tools/smoke_companion_director.gd", '"res://src/equipment_runtime.gd"]', '"res://src/equipment_runtime.gd", "res://src/merchant_runtime.gd"]')
          replace_once("tools/smoke_item_forge.gd", '== 10, "Reference campaign must expose ten inventory and equipment item definitions."', '== 11, "Reference campaign must expose eleven inventory and equipment item definitions."')
          replace_once("tools/smoke_item_forge.gd", '"res://src/equipment_runtime.gd"]', '"res://src/equipment_runtime.gd", "res://src/merchant_runtime.gd"]')
          replace_once("tools/smoke_item_forge_editor.gd", 'item_count == 10, "Item Forge must display all ten reference items."', 'item_count == 11, "Item Forge must display all eleven reference items."')
          replace_once("tools/smoke_item_forge_editor.gd", 'item_count == 10, "Recipe output selector must contain every reference item."', 'item_count == 11, "Recipe output selector must contain every reference item."')
          replace_once("tools/smoke_story_studio.gd", '"res://src/equipment_runtime.gd"]', '"res://src/equipment_runtime.gd", "res://src/merchant_runtime.gd"]')
          replace_once("tools/smoke_save_profiles.gd", '== "res://src/equipment_runtime.gd", "Runtime scene must bind the equipment-aware save runtime."', '== "res://src/merchant_runtime.gd", "Runtime scene must bind the merchant-aware save runtime."')
          replace_once("tools/smoke_loadout_runtime.gd", '== 4, "Reference campaign must expose four equipment items."', '== 5, "Reference campaign must expose five equipment items."')
          replace_once("tools/smoke_loadout_runtime.gd", '== "res://src/equipment_runtime.gd", "Runtime scene must bind the equipment-aware runtime."', '== "res://src/merchant_runtime.gd", "Runtime scene must bind the merchant-aware runtime."')
          replace_once("tools/smoke_loadout_studio.gd", 'item_count == 4, "Reference campaign must expose four equipment items in the editor."', 'item_count == 5, "Reference campaign must expose five equipment items in the editor."')

          # Explicit schema-2 migration proof.
          replace_once(
              "tools/smoke_save_migrations.gd",
              '\ttest_legacy_migration()\n',
              '\ttest_legacy_migration()\n\ttest_schema_two_economy_migration()\n'
          )
          replace_once(
              "tools/smoke_save_migrations.gd",
              '\n\nfunc test_default_policy_compatibility() -> void:\n',
              '''

          func test_schema_two_economy_migration() -> void:
          \tvar legacy := valid_profile("Schema two economy migration", 82)
          \tlegacy["schema_version"] = 2
          \tvar payload: Dictionary = legacy.get("payload", {})
          \tpayload.erase("currency_balances")
          \tpayload.erase("merchant_stock")
          \tpayload.erase("economy_initialized")
          \tlegacy["payload"] = payload
          \tSaveProfile.refresh_checksum(legacy)
          \tvar migration := SaveProfile.migrate(legacy)
          \tcheck(bool(migration.get("ok", false)), "Schema 2 profile must migrate to the economy-aware schema.")
          \tcheck(bool(migration.get("migrated", false)), "Schema 2 migration must report a change.")
          \tcheck(int(migration.get("from_version", -1)) == 2, "Schema 2 migration must preserve the source version.")
          \tvar migrated: Dictionary = migration.get("profile", {})
          \tvar migrated_payload: Dictionary = migrated.get("payload", {})
          \tcheck(int(migrated.get("schema_version", 0)) == SaveProfile.CURRENT_SCHEMA, "Schema 2 profile must migrate to the current schema.")
          \tcheck(typeof(migrated_payload.get("currency_balances")) == TYPE_DICTIONARY, "Migration must add a wallet dictionary.")
          \tcheck(typeof(migrated_payload.get("merchant_stock")) == TYPE_DICTIONARY, "Migration must add merchant stock state.")
          \tcheck(not bool(migrated_payload.get("economy_initialized", true)), "Pre-economy saves must request authored defaults on first load.")
          \tcheck(SaveProfile.checksum_valid(migrated), "Migrated schema 2 profile must receive a valid checksum.")


          func test_default_policy_compatibility() -> void:
          '''
          )

          # Permanent GitHub Actions stages.
          validation_path = Path(".github/workflows/validate.yml")
          validation = validation_path.read_text(encoding="utf-8")
          validation += '''

                - name: Smoke test merchant transactions and durable economy
                  shell: bash
                  run: |
                    set -euo pipefail
                    log_file="$(mktemp)"
                    set +e
                    timeout 60s .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" --script res://tools/smoke_economy_runtime.gd 2>&1 | tee "$log_file"
                    godot_status=${PIPESTATUS[0]}
                    set -e
                    if [ "$godot_status" -ne 0 ]; then
                      exit "$godot_status"
                    fi
                    if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
                      exit 1
                    fi

                - name: Smoke test Merchant and Economy Studio editor state
                  shell: bash
                  run: |
                    set -euo pipefail
                    log_file="$(mktemp)"
                    set +e
                    timeout 60s .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" --script res://tools/smoke_trade_studio.gd 2>&1 | tee "$log_file"
                    godot_status=${PIPESTATUS[0]}
                    set -e
                    if [ "$godot_status" -ne 0 ]; then
                      exit "$godot_status"
                    fi
                    if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
                      exit 1
                    fi

                - name: Smoke test malformed currencies merchants stock and economy saves
                  shell: bash
                  run: |
                    set -euo pipefail
                    log_file="$(mktemp)"
                    set +e
                    timeout 60s .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" --script res://tools/smoke_economy_validation_edges.gd 2>&1 | tee "$log_file"
                    godot_status=${PIPESTATUS[0]}
                    set -e
                    if [ "$godot_status" -ne 0 ]; then
                      exit "$godot_status"
                    fi
                    if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
                      exit 1
                    fi
          '''
          validation_path.write_text(validation, encoding="utf-8", newline="\n")

          # Matching Windows validation stages.
          ps_path = Path("scripts/validate.ps1")
          ps = ps_path.read_text(encoding="utf-8")
          marker = '    Write-Host "`nEpochbound project, campaign, world-model, encounter, Combat Director, Companion Studio, Item Forge, Story Studio, Save & State Studio and Loadout Studio validation passed."\n'
          addition = '''    Invoke-GodotStep "Smoke test merchant transactions and durable economy" @(
                  "--headless", "--path", $ProjectRoot,
                  "--script", "res://tools/smoke_economy_runtime.gd"
              )

              Invoke-GodotStep "Smoke test Merchant and Economy Studio editor state" @(
                  "--headless", "--path", $ProjectRoot,
                  "--script", "res://tools/smoke_trade_studio.gd"
              )

              Invoke-GodotStep "Smoke test malformed currencies merchants stock and economy saves" @(
                  "--headless", "--path", $ProjectRoot,
                  "--script", "res://tools/smoke_economy_validation_edges.gd"
              )

              Write-Host "`nEpochbound project and all nine authoring systems passed complete merchant-aware validation."
          '''
          if ps.count(marker) != 1:
              raise SystemExit("scripts/validate.ps1: final validation marker not found exactly once")
          ps_path.write_text(ps.replace(marker, addition, 1), encoding="utf-8", newline="\n")

          Path(".github/workflows/apply-economy-validation-suite.yml").unlink()

      - name: Commit validation suite
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: extend permanent validation through merchant economy"
          git push origin HEAD:work/merchant-economy-foundation-20260729
