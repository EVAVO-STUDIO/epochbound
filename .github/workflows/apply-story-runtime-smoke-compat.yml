name: Align inherited smoke tests with Story runtime

on:
  push:
    branches:
      - work/story-studio-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Accept the fully layered Story runtime
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/story-studio-foundation-20260729

      - name: Apply exact smoke-test changes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "tools/smoke_encounters.gd": [
                  (
                      '\t"res://src/inventory_runtime.gd"\n]',
                      '\t"res://src/inventory_runtime.gd",\n\t"res://src/story_runtime.gd"\n]',
                  )
              ],
              "tools/smoke_combat_director.gd": [
                  (
                      'runtime_path in ["res://src/combat_director_runtime.gd", "res://src/companion_runtime.gd", "res://src/inventory_runtime.gd"],',
                      'runtime_path in ["res://src/combat_director_runtime.gd", "res://src/companion_runtime.gd", "res://src/inventory_runtime.gd", "res://src/story_runtime.gd"],',
                  )
              ],
              "tools/smoke_companion_director.gd": [
                  (
                      'str((script_value as GDScript).resource_path) in ["res://src/companion_runtime.gd", "res://src/inventory_runtime.gd"],',
                      'str((script_value as GDScript).resource_path) in ["res://src/companion_runtime.gd", "res://src/inventory_runtime.gd", "res://src/story_runtime.gd"],',
                  )
              ],
              "tools/smoke_item_forge.gd": [
                  (
                      'str((script_value as GDScript).resource_path) == "res://src/inventory_runtime.gd",\n\t\t\t"Runtime scene must bind the inventory runtime."',
                      'str((script_value as GDScript).resource_path) in ["res://src/inventory_runtime.gd", "res://src/story_runtime.gd"],\n\t\t\t"Runtime scene must bind an inventory-capable runtime."',
                  )
              ],
          }

          for filename, file_replacements in replacements.items():
              path = Path(filename)
              source = path.read_text(encoding="utf-8")
              for old, new in file_replacements:
                  if source.count(old) != 1:
                      raise SystemExit(f"{filename}: expected exactly one occurrence of {old!r}, found {source.count(old)}")
                  source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8", newline="\n")

          Path(".github/workflows/apply-story-runtime-smoke-compat.yml").unlink()

      - name: Commit inherited smoke compatibility
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/smoke_encounters.gd tools/smoke_combat_director.gd tools/smoke_companion_director.gd tools/smoke_item_forge.gd .github/workflows/apply-story-runtime-smoke-compat.yml
          git commit -m "test: accept Story runtime in inherited smoke suites"
          git push origin HEAD:work/story-studio-foundation-20260729
