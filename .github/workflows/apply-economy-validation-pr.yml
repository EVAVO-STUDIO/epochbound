name: Apply economy validation patch from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'work/merchant-economy-foundation-20260729'
    runs-on: ubuntu-latest

    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: work/merchant-economy-foundation-20260729

      - name: Execute the reviewed validation patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-economy-validation-suite.yml').read_text(encoding='utf-8')
          section = source.split('      - name: Apply exact regression updates', 1)[1]
          section = section.split('      - name: Commit validation suite', 1)[0]
          code = section.split('        run: |', 1)[1]
          exec(textwrap.dedent(code), {})
          Path('.github/workflows/apply-economy-validation-pr.yml').unlink()

      - name: Commit permanent validation changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: extend permanent validation through merchant economy"
          git push origin HEAD:work/merchant-economy-foundation-20260729
