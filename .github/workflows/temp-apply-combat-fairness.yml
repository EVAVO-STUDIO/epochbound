name: Temporary Apply Combat Fairness

on:
  push:
    branches:
      - agent/combat-fairness-target-lock

permissions:
  contents: write

concurrency:
  group: epochbound-temp-combat-fairness
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
      GODOT_BINARY: Godot_v4.6.2-stable_linux.x86_64
      GODOT_RELEASE_URL: https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable

    steps:
      - name: Check out exact branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic combat fairness edits
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/temp_apply_combat_fairness.py
          python3 - <<'PY'
          from pathlib import Path

          old = '# Receipt schema migrated from: "schemaVersion": "2.3"'
          new = '# Receipt schema migrated from: "schemaVersion": "2.2"'
          changed = []
          for path in sorted(Path("tools").glob("check_*_contract.py")):
              source = path.read_text(encoding="utf-8")
              updated = source.replace(old, new)
              if updated == source:
                  continue
              path.write_text(updated, encoding="utf-8")
              changed.append(path.as_posix())
          if not changed:
              raise SystemExit("no schema-aware checker migration tokens were restored")
          print("restored prior-schema markers:")
          for path in changed:
              print(f"- {path}")
          PY
          git diff --check

      - name: Run all fail-closed source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/*.py
          rm -rf tools/__pycache__
          python3 tools/check_release_workflow_policy.py
          for checker in tools/check_*_contract.py; do
            python3 "$checker"
          done

      - name: Download and verify official Godot 4.6.2 editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin .godot-download
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output .godot-download/SHA512-SUMS.txt \
            "${GODOT_RELEASE_URL}/SHA512-SUMS.txt"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output ".godot-download/${GODOT_ARCHIVE}" \
            "${GODOT_RELEASE_URL}/${GODOT_ARCHIVE}"
          grep -F "  ${GODOT_ARCHIVE}" .godot-download/SHA512-SUMS.txt \
            > .godot-download/selected-SHA512-SUMS.txt
          (cd .godot-download && sha512sum --check selected-SHA512-SUMS.txt)
          unzip -q ".godot-download/${GODOT_ARCHIVE}" -d .godot-bin
          mv ".godot-bin/${GODOT_BINARY}" .godot-bin/godot
          chmod +x .godot-bin/godot
          version="$(.godot-bin/godot --version)"
          [[ "${version}" =~ ^4\.6\.2 ]] || { echo "Unexpected Godot version: ${version}" >&2; exit 1; }
          command -v pwsh >/dev/null || { echo "PowerShell is required" >&2; exit 1; }
          rm -rf .godot-download

      - name: Run complete leak-free seventeen-system validation gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE/scripts/validate.ps1" `
            -GodotExecutable "$env:GITHUB_WORKSPACE/.godot-bin/godot"

      - name: Run real ENet graceful reconnect gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE/scripts/validate_multiplayer_loopback.ps1" `
            -GodotExecutable "$env:GITHUB_WORKSPACE/.godot-bin/godot" `
            -ProjectRoot "$env:GITHUB_WORKSPACE"

      - name: Verify and publish permanent source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only > "${RUNNER_TEMP}/changed-files.txt"
          grep -v '^\.github/workflows/validate\.yml$' "${RUNNER_TEMP}/changed-files.txt" \
            > "${RUNNER_TEMP}/publish-files.txt"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          allowed_exact = {
              ".github/workflows/validate.yml",
              "docs/COMBAT_DIRECTOR.md",
              "scripts/validate.ps1",
              "src/combat_director_runtime.gd",
              "tools/check_release_workflow_policy.py",
              "tools/smoke_combat_director.gd",
          }
          root = Path(os.environ["RUNNER_TEMP"])
          changed = [
              line.strip()
              for line in (root / "changed-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          publish = [
              line.strip()
              for line in (root / "publish-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if not changed or not publish:
              raise SystemExit("combat fairness applicator produced no publishable source changes")
          if ".github/workflows/validate.yml" not in changed:
              raise SystemExit("validated exact-main workflow update is missing")
          unexpected = [
              path
              for path in changed
              if path not in allowed_exact
              and re.fullmatch(r"tools/check_[a-z0-9_]+_contract\.py", path) is None
          ]
          if unexpected:
              raise SystemExit("unexpected changed files: " + ", ".join(unexpected))
          print("validated permanent changes:")
          for path in changed:
              print(f"- {path}")
          print("publishing source files through Actions:")
          for path in publish:
              print(f"- {path}")
          print("publishing protected workflow separately through the GitHub connector")
          PY
          git add --pathspec-from-file="${RUNNER_TEMP}/publish-files.txt"
          git diff --cached --check
          git config user.name "EVAVO Release Agent"
          git config user.email "evavo.studio@gmail.com"
          git commit -m "fix: lock combat telegraphs and cancel interrupted attacks [skip ci]"
          git push origin HEAD:agent/combat-fairness-target-lock
