name: Apply Boss runtime wiring

on:
  push:
    branches: [work/boss-phase-foundation-20260730]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/boss-phase-foundation-20260730
      - name: Wire runtime editor compile and final validator
        shell: python
        run: |
          from pathlib import Path

          def patch(path_name, old, new):
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one marker in {path_name}: {old!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          patch("src/app.tscn", "res://src/arsenal_runtime.gd", "res://src/boss_runtime.gd")

          project = Path("project.godot")
          text = project.read_text(encoding="utf-8")
          marker = '"res://addons/epochbound_arsenal_studio/plugin.cfg")'
          if marker not in text:
              raise SystemExit("Arsenal plugin marker missing")
          text = text.replace(marker, '"res://addons/epochbound_arsenal_studio/plugin.cfg", "res://addons/epochbound_boss_studio/plugin.cfg")', 1)
          project.write_text(text, encoding="utf-8", newline="\n")

          compile_path = Path("tools/compile_probe.gd")
          text = compile_path.read_text(encoding="utf-8")
          pairs = [
              ('\t"res://src/arsenal_runtime.gd",\n', '\t"res://src/arsenal_runtime.gd",\n\t"res://src/boss_runtime.gd",\n'),
              ('\t"res://src/content/arsenal_validator.gd",\n', '\t"res://src/content/arsenal_validator.gd",\n\t"res://src/content/boss_catalog.gd",\n\t"res://src/content/boss_validator.gd",\n'),
              ('\t"res://addons/epochbound_arsenal_studio/plugin.gd",\n', '\t"res://addons/epochbound_arsenal_studio/plugin.gd",\n\t"res://addons/epochbound_boss_studio/boss_studio.gd",\n\t"res://addons/epochbound_boss_studio/plugin.gd",\n'),
              ('\t"res://tools/smoke_arsenal_validation_edges.gd",\n', '\t"res://tools/smoke_arsenal_validation_edges.gd",\n\t"res://tools/smoke_boss_runtime.gd",\n\t"res://tools/smoke_boss_studio.gd",\n\t"res://tools/smoke_boss_validation_edges.gd",\n'),
          ]
          for old, new in pairs:
              if text.count(old) != 1:
                  raise SystemExit(f"Compile marker missing: {old!r}")
              text = text.replace(old, new, 1)
          text = text.replace("all ten editors", "all eleven editors")
          compile_path.write_text(text, encoding="utf-8", newline="\n")

          validator = Path("tools/validate_content.gd")
          text = validator.read_text(encoding="utf-8")
          text = text.replace('const EquipmentValidator = preload("res://src/content/arsenal_validator.gd")', 'const FinalValidator = preload("res://src/content/boss_validator.gd")')
          text = text.replace("EquipmentValidator.validate_all()", "FinalValidator.validate_all()")
          text = text.replace(
              "%d ranged enemy profile(s), %d warning(s), %d error(s).",
              "%d ranged enemy profile(s), %d boss definition(s), %d boss placement(s), %d boss phase(s), %d boss pattern step(s), %d boss reinforcement(s), %d warning(s), %d error(s).",
          )
          marker = '\t\t\treport.get("ranged_enemy_count", 0),\n\t\t\treport.get("warnings", []).size(),'
          insertion = '\t\t\treport.get("ranged_enemy_count", 0),\n\t\t\treport.get("boss_count", 0),\n\t\t\treport.get("boss_placement_count", 0),\n\t\t\treport.get("boss_phase_count", 0),\n\t\t\treport.get("boss_pattern_step_count", 0),\n\t\t\treport.get("boss_reinforcement_count", 0),\n\t\t\treport.get("warnings", []).size(),'
          if marker not in text:
              raise SystemExit("Final validator count marker missing")
          validator.write_text(text.replace(marker, insertion, 1), encoding="utf-8", newline="\n")

          Path(".github/workflows/apply-boss-runtime-wiring.yml").unlink()
      - name: Commit runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire Boss Studio runtime and final validator"
          git push origin HEAD:work/boss-phase-foundation-20260730
