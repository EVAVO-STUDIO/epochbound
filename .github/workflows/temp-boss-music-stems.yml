name: Temporary Publish Clean Boss Music Candidate

on:
  push:
    branches:
      - agent/boss-phase-music-stems

permissions:
  contents: write

concurrency:
  group: epochbound-clean-boss-music-release
  cancel-in-progress: false

jobs:
  publish-clean-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_BRANCH: agent/boss-phase-music-stems-release
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
      GODOT_BINARY: Godot_v4.6.2-stable_linux.x86_64
      GODOT_RELEASE_URL: https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable

    steps:
      - name: Check out exact authored source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assemble clean candidate from current main
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git fetch origin main
          git checkout -B "${RELEASE_BRANCH}" origin/main
          git checkout "${source_sha}" -- \
            .github/workflows/audio-mood-validation.yml \
            .github/workflows/validate.yml \
            README.md \
            addons/epochbound_audio_mood_studio/audio_mood_studio.gd \
            campaigns/epochbound_demo/audio/core.json \
            docs/AUDIO_MOOD_STUDIO.md \
            docs/BOSS_MUSIC_STEMS.md \
            scripts/validate.ps1 \
            src/audio_mood_controller.gd \
            src/audio_mood_runtime.gd \
            src/content/audio_mood_catalog.gd \
            src/content/audio_mood_strict_validator.gd \
            src/content/audio_mood_validator.gd \
            tools/check_boss_music_stem_contract.py \
            tools/check_combat_fairness_contract.py \
            tools/check_multiplayer_connection_contract.py \
            tools/check_multiplayer_loopback_contract.py \
            tools/check_release_workflow_policy.py \
            tools/check_temporal_shift_contract.py \
            tools/compile_probe.gd \
            tools/smoke_audio_mood_studio.gd \
            tools/smoke_audio_mood_validation_edges.gd \
            tools/smoke_boss_music_stems.gd
          git diff --check

      - name: Run every fail-closed source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/*.py
          rm -rf tools/__pycache__
          python3 tools/check_release_workflow_policy.py
          for checker in tools/check_*_contract.py; do
            python3 "$checker"
          done

      - name: Download and verify official Godot 4.6.2 editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin .godot-download
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output .godot-download/SHA512-SUMS.txt \
            "${GODOT_RELEASE_URL}/SHA512-SUMS.txt"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output ".godot-download/${GODOT_ARCHIVE}" \
            "${GODOT_RELEASE_URL}/${GODOT_ARCHIVE}"
          grep -F "  ${GODOT_ARCHIVE}" .godot-download/SHA512-SUMS.txt \
            > .godot-download/selected-SHA512-SUMS.txt
          (cd .godot-download && sha512sum --check selected-SHA512-SUMS.txt)
          unzip -q ".godot-download/${GODOT_ARCHIVE}" -d .godot-bin
          mv ".godot-bin/${GODOT_BINARY}" .godot-bin/godot
          chmod +x .godot-bin/godot
          version="$(.godot-bin/godot --version)"
          [[ "${version}" =~ ^4\.6\.2 ]] || { echo "Unexpected Godot version: ${version}" >&2; exit 1; }
          command -v pwsh >/dev/null || { echo "PowerShell is required" >&2; exit 1; }
          rm -rf .godot-download

      - name: Run complete leak-free seventeen-system validation gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE/scripts/validate.ps1" `
            -GodotExecutable "$env:GITHUB_WORKSPACE/.godot-bin/godot"

      - name: Run real ENet graceful reconnect gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE/scripts/validate_multiplayer_loopback.ps1" `
            -GodotExecutable "$env:GITHUB_WORKSPACE/.godot-bin/godot" `
            -ProjectRoot "$env:GITHUB_WORKSPACE"

      - name: Publish only permanent non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=origin/main -- \
            .github/workflows/audio-mood-validation.yml \
            .github/workflows/validate.yml
          git diff --check
          git diff --name-only origin/main > "${RUNNER_TEMP}/changed-files.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path

          expected = {
              "README.md",
              "addons/epochbound_audio_mood_studio/audio_mood_studio.gd",
              "campaigns/epochbound_demo/audio/core.json",
              "docs/AUDIO_MOOD_STUDIO.md",
              "docs/BOSS_MUSIC_STEMS.md",
              "scripts/validate.ps1",
              "src/audio_mood_controller.gd",
              "src/audio_mood_runtime.gd",
              "src/content/audio_mood_catalog.gd",
              "src/content/audio_mood_strict_validator.gd",
              "src/content/audio_mood_validator.gd",
              "tools/check_boss_music_stem_contract.py",
              "tools/check_combat_fairness_contract.py",
              "tools/check_multiplayer_connection_contract.py",
              "tools/check_multiplayer_loopback_contract.py",
              "tools/check_release_workflow_policy.py",
              "tools/check_temporal_shift_contract.py",
              "tools/compile_probe.gd",
              "tools/smoke_audio_mood_studio.gd",
              "tools/smoke_audio_mood_validation_edges.gd",
              "tools/smoke_boss_music_stems.gd",
          }
          changed_path = Path(os.environ["RUNNER_TEMP"]) / "changed-files.txt"
          changed = {
              line.strip()
              for line in changed_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          if changed != expected:
              missing = sorted(expected - changed)
              unexpected = sorted(changed - expected)
              raise SystemExit(
                  f"clean boss music release scope mismatch; missing={missing}; unexpected={unexpected}"
              )
          print("validated clean boss music release files:")
          for path in sorted(changed):
              print(f"- {path}")
          PY
          git add --pathspec-from-file="${RUNNER_TEMP}/changed-files.txt"
          git diff --cached --check
          git config user.name "EVAVO Release Agent"
          git config user.email "evavo.studio@gmail.com"
          git commit -m "feat: add authored boss phase music stems [skip ci]"
          git push --force origin HEAD:"${RELEASE_BRANCH}"
