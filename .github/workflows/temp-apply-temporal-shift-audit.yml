name: Temporary Align Validation Schema Consumers

on:
  push:
    branches:
      - agent/temporal-shift-audit

permissions:
  contents: write

concurrency:
  group: epochbound-temp-align-validation-schema
  cancel-in-progress: false

jobs:
  align:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Update stale checker schema expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changed = []
          for path in sorted(Path("tools").glob("check_*contract.py")):
              if path.name == "check_temporal_shift_contract.py":
                  continue
              source = path.read_text(encoding="utf-8")
              updated = source.replace('"schemaVersion": "2.0"', '"schemaVersion": "2.2"')
              updated = updated.replace('"schemaVersion": "2.1"', '"schemaVersion": "2.2"')
              if updated == source:
                  continue
              path.write_text(updated, encoding="utf-8")
              changed.append(path.as_posix())
          if not changed:
              raise SystemExit("no stale validation schema consumers were found")
          print("updated schema consumers:")
          for path in changed:
              print(f"- {path}")
          PY
          python3 -m py_compile tools/*.py
          rm -rf tools/__pycache__
          git diff --check
          invalid="$(git diff --name-only | grep -Ev '^tools/check_.*_contract\.py$' || true)"
          [[ -z "${invalid}" ]] || { echo "Unexpected changed files:" >&2; echo "${invalid}" >&2; exit 1; }
          git add tools/check_*_contract.py
          git config user.name "EVAVO Release Agent"
          git config user.email "evavo.studio@gmail.com"
          git commit -m "ci: align exact-main receipt schema consumers [skip ci]"
          git push origin HEAD:agent/temporal-shift-audit
