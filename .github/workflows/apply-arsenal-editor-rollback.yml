name: Apply Arsenal editor rollback

on:
  push:
    branches:
      - work/arsenal-ranged-foundation-20260730

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: work/arsenal-ranged-foundation-20260730

      - name: Add transactional Arsenal saves and tests
        shell: python
        run: |
          from pathlib import Path

          studio_path = Path("addons/epochbound_arsenal_studio/arsenal_studio.gd")
          studio = studio_path.read_text(encoding="utf-8")
          old = '''func save_item_catalog() -> bool:\n\tvar result := Repository.save_json(active_item_path, active_item_catalog)\n\tif not bool(result.get("ok", false)):\n\t\tset_status(format_messages(result.get("errors", [])), true)\n\t\treturn false\n\trescan_editor_files()\n\tvar report := ArsenalValidator.validate_campaign_path(active_campaign_path)\n\tif not bool(report.get("ok", false)):\n\t\tset_status(format_report(report), true)\n\t\treturn false\n\treturn true\n\n\nfunc save_object_catalog() -> bool:\n\tvar result := Repository.save_json(active_object_path, active_object_catalog)\n\tif not bool(result.get("ok", false)):\n\t\tset_status(format_messages(result.get("errors", [])), true)\n\t\treturn false\n\trescan_editor_files()\n\tvar report := ArsenalValidator.validate_campaign_path(active_campaign_path)\n\tif not bool(report.get("ok", false)):\n\t\tset_status(format_report(report), true)\n\t\treturn false\n\treturn true\n'''
          new = '''func save_item_catalog() -> bool:\n\tvar previous_result := Repository.read_json(active_item_path)\n\tif not bool(previous_result.get("ok", false)):\n\t\tset_status(format_messages(previous_result.get("errors", [])), true)\n\t\treturn false\n\tvar previous: Dictionary = (previous_result.get("data", {}) as Dictionary).duplicate(true)\n\tvar result := Repository.save_json(active_item_path, active_item_catalog)\n\tif not bool(result.get("ok", false)):\n\t\tset_status(format_messages(result.get("errors", [])), true)\n\t\treturn false\n\trescan_editor_files()\n\tvar report := ArsenalValidator.validate_campaign_path(active_campaign_path)\n\tif not bool(report.get("ok", false)):\n\t\tvar rollback := Repository.save_json(active_item_path, previous)\n\t\tactive_item_catalog = previous\n\t\trebuild_definitions()\n\t\trescan_editor_files()\n\t\tif not bool(rollback.get("ok", false)):\n\t\t\tset_status("Invalid Arsenal edit and rollback failed: %s" % format_messages(rollback.get("errors", [])), true)\n\t\telse:\n\t\t\tset_status("Invalid Arsenal item edit was rolled back. %s" % format_report(report), true)\n\t\treturn false\n\treturn true\n\n\nfunc save_object_catalog() -> bool:\n\tvar previous_result := Repository.read_json(active_object_path)\n\tif not bool(previous_result.get("ok", false)):\n\t\tset_status(format_messages(previous_result.get("errors", [])), true)\n\t\treturn false\n\tvar previous: Dictionary = (previous_result.get("data", {}) as Dictionary).duplicate(true)\n\tvar result := Repository.save_json(active_object_path, active_object_catalog)\n\tif not bool(result.get("ok", false)):\n\t\tset_status(format_messages(result.get("errors", [])), true)\n\t\treturn false\n\trescan_editor_files()\n\tvar report := ArsenalValidator.validate_campaign_path(active_campaign_path)\n\tif not bool(report.get("ok", false)):\n\t\tvar rollback := Repository.save_json(active_object_path, previous)\n\t\tactive_object_catalog = previous\n\t\trebuild_definitions()\n\t\trescan_editor_files()\n\t\tif not bool(rollback.get("ok", false)):\n\t\t\tset_status("Invalid enemy-profile edit and rollback failed: %s" % format_messages(rollback.get("errors", [])), true)\n\t\telse:\n\t\t\tset_status("Invalid enemy-profile edit was rolled back. %s" % format_report(report), true)\n\t\treturn false\n\treturn true\n'''
          if studio.count(old) != 1:
              raise SystemExit("Arsenal Studio save functions did not match reviewed source")
          studio_path.write_text(studio.replace(old, new, 1), encoding="utf-8", newline="\n")

          test_path = Path("tools/smoke_arsenal_studio.gd")
          test = test_path.read_text(encoding="utf-8")
          test = test.replace(
              'const ArsenalCatalog = preload("res://src/content/arsenal_catalog.gd")\n',
              'const ArsenalCatalog = preload("res://src/content/arsenal_catalog.gd")\nconst Repository = preload("res://src/content/campaign_repository.gd")\n',
              1
          )
          marker = '''\tvar default_ammo := ArsenalCatalog.default_ammunition("test_bolts", "Test Bolts")\n'''
          tests = '''\t# Invalid item edits must restore both the file and in-memory catalogue.\n\tvar item_path := str(studio.get("active_item_path"))\n\tvar valid_item_read := Repository.read_json(item_path)\n\tcheck(bool(valid_item_read.get("ok", false)), "Arsenal rollback test must read the valid item catalogue.")\n\tvar invalid_items: Dictionary = (studio.get("active_item_catalog") as Dictionary).duplicate(true)\n\tfor index in range((invalid_items.get("items", []) as Array).size()):\n\t\tvar candidate: Dictionary = (invalid_items.get("items", []) as Array)[index]\n\t\tif str(candidate.get("id", "")) == "clockglass_dartcaster":\n\t\t\tvar equipment: Dictionary = candidate.get("equipment", {})\n\t\t\tvar ranged: Dictionary = equipment.get("ranged", {})\n\t\t\tranged["ammo_item_id"] = "missing_ammunition"\n\t\t\tequipment["ranged"] = ranged\n\t\t\tcandidate["equipment"] = equipment\n\t\t\t(invalid_items.get("items", []) as Array)[index] = candidate\n\tstudio.set("active_item_catalog", invalid_items)\n\tcheck(not bool(studio.call("save_item_catalog")), "Invalid ranged item edit must be rejected.")\n\tvar restored_item_read := Repository.read_json(item_path)\n\tcheck(bool(restored_item_read.get("ok", false)), "Rejected item edit must leave a readable catalogue.")\n\tvar restored_item_catalog: Dictionary = restored_item_read.get("data", {})\n\tvar restored_ammo_id := ""\n\tfor record_value in restored_item_catalog.get("items", []):\n\t\tif typeof(record_value) == TYPE_DICTIONARY and str((record_value as Dictionary).get("id", "")) == "clockglass_dartcaster":\n\t\t\trestored_ammo_id = str((((record_value as Dictionary).get("equipment", {}) as Dictionary).get("ranged", {}) as Dictionary).get("ammo_item_id", ""))\n\tcheck(restored_ammo_id == "archive_bolts", "Invalid ranged item edit must restore the prior ammunition reference.")\n\n\t# Invalid enemy profiles receive the same transactional rollback.\n\tvar object_path := str(studio.get("active_object_path"))\n\tvar invalid_objects: Dictionary = (studio.get("active_object_catalog") as Dictionary).duplicate(true)\n\tfor index in range((invalid_objects.get("objects", []) as Array).size()):\n\t\tvar candidate: Dictionary = (invalid_objects.get("objects", []) as Array)[index]\n\t\tif str(candidate.get("id", "")) == "underworks_sentinel":\n\t\t\tcandidate["attack_radius"] = 500\n\t\t\t(invalid_objects.get("objects", []) as Array)[index] = candidate\n\tstudio.set("active_object_catalog", invalid_objects)\n\tcheck(not bool(studio.call("save_object_catalog")), "Invalid ranged enemy edit must be rejected.")\n\tvar restored_object_read := Repository.read_json(object_path)\n\tcheck(bool(restored_object_read.get("ok", false)), "Rejected enemy edit must leave a readable catalogue.")\n\tvar restored_attack_radius := 0.0\n\tfor record_value in (restored_object_read.get("data", {}) as Dictionary).get("objects", []):\n\t\tif typeof(record_value) == TYPE_DICTIONARY and str((record_value as Dictionary).get("id", "")) == "underworks_sentinel":\n\t\t\trestored_attack_radius = float((record_value as Dictionary).get("attack_radius", 0.0))\n\tcheck(restored_attack_radius == 160.0, "Invalid enemy edit must restore the prior attack radius.")\n\n'''
          if test.count(marker) != 1:
              raise SystemExit("Arsenal Studio smoke insertion marker not found")
          test_path.write_text(test.replace(marker, tests + marker, 1), encoding="utf-8", newline="\n")

      - name: Commit rollback support
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons/epochbound_arsenal_studio/arsenal_studio.gd tools/smoke_arsenal_studio.gd
          git commit -m "fix: roll back invalid Arsenal editor writes"
          git push origin HEAD:work/arsenal-ranged-foundation-20260730
