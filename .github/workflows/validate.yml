name: Validate Godot Project

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: epochbound-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-cinematic:
    name: Integrate cinematic branch source
    if: (github.event_name == 'push' && github.ref == 'refs/heads/work/cinematic-timeline-foundation-20260730') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'work/cinematic-timeline-foundation-20260730')
    runs-on: ubuntu-latest
    steps:
      - name: Check out cinematic branch
        uses: actions/checkout@v4
        with:
          ref: work/cinematic-timeline-foundation-20260730
          fetch-depth: 0
      - name: Apply one-time integration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/apply_cinematic_integration.py ]; then
            echo "Cinematic integration already committed."
            exit 0
          fi
          python tools/apply_cinematic_integration.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Cinematic and Timeline Studio"
          git push origin HEAD:work/cinematic-timeline-foundation-20260730

  validate:
    name: Godot 4.6.2 validation
    needs: integrate-cinematic
    if: always() && (needs.integrate-cinematic.result == 'success' || needs.integrate-cinematic.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download official Godot 4.6.2 editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip"
          unzip -q godot.zip -d .godot-bin
          mv .godot-bin/Godot_v4.6.2-stable_linux.x86_64 .godot-bin/godot
          chmod +x .godot-bin/godot
          .godot-bin/godot --version

      - name: Compile runtime scenes editors validators and tests
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          set +e
          timeout 60s .godot-bin/godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --script res://tools/compile_probe.gd 2>&1 | tee "$log_file"
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then
            exit "$godot_status"
          fi
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
            exit 1
          fi

      - name: Import project and reject hidden parser errors
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          set +e
          timeout 90s .godot-bin/godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --import 2>&1 | tee "$log_file"
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then
            exit "$godot_status"
          fi
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
            echo "Godot import emitted parser or resource errors."
            exit 1
          fi

      - name: Validate complete campaign content
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          set +e
          timeout 60s .godot-bin/godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --script res://tools/validate_content.gd 2>&1 | tee "$log_file"
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then
            exit "$godot_status"
          fi
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
            exit 1
          fi

      - name: Run complete executable regression suite
        shell: bash
        run: |
          set -euo pipefail

          run_godot_test() {
            local script_path="$1"
            local label="$2"
            local log_file
            log_file="$(mktemp)"
            echo ""
            echo "==> ${label}"
            set +e
            timeout 60s .godot-bin/godot \
              --headless \
              --path "$GITHUB_WORKSPACE" \
              --script "$script_path" 2>&1 | tee "$log_file"
            local godot_status=${PIPESTATUS[0]}
            set -e
            if [ "$godot_status" -ne 0 ]; then
              echo "${label} failed with exit code ${godot_status}."
              exit "$godot_status"
            fi
            if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
              echo "${label} emitted a Godot parser or runtime error."
              exit 1
            fi
          }

          run_godot_test res://tools/smoke_world_model.gd "World model and traversal"
          run_godot_test res://tools/smoke_encounters.gd "Encounter catalogs placements and combat"
          run_godot_test res://tools/smoke_combat_director.gd "Combat Director zones and behaviour"
          run_godot_test res://tools/smoke_companion_director.gd "Companion commands and discovery"
          run_godot_test res://tools/smoke_item_forge.gd "Item Forge inventory and crafting"
          run_godot_test res://tools/smoke_item_forge_editor.gd "Item Forge editor state"
          run_godot_test res://tools/smoke_item_validation_edges.gd "Malformed item rewards and recipe unlocks"
          run_godot_test res://tools/smoke_story_studio.gd "Story branching and quest progression"
          run_godot_test res://tools/smoke_story_studio_editor.gd "Story Studio graph and forms"
          run_godot_test res://tools/smoke_story_validation_edges.gd "Malformed story graphs and quest records"
          run_godot_test res://tools/smoke_save_profiles.gd "Save capture and exact restoration"
          run_godot_test res://tools/smoke_save_migrations.gd "Save migrations integrity and backup recovery"
          run_godot_test res://tools/smoke_save_state_studio.gd "Save and State Studio inspector"
          run_godot_test res://tools/smoke_loadout_runtime.gd "Loadout stats capability gates and restoration"
          run_godot_test res://tools/smoke_loadout_studio.gd "Loadout Studio editor state"
          run_godot_test res://tools/smoke_equipment_validation_edges.gd "Malformed equipment capabilities and gates"
          run_godot_test res://tools/smoke_economy_runtime.gd "Merchant transactions and durable economy"
          run_godot_test res://tools/smoke_trade_studio.gd "Merchant and Economy Studio editor state"
          run_godot_test res://tools/smoke_economy_validation_edges.gd "Malformed currencies merchants stock and economy saves"
          run_godot_test res://tools/smoke_arsenal_runtime.gd "Arsenal ranged combat reloads and durable magazines"
          run_godot_test res://tools/smoke_arsenal_studio.gd "Arsenal Studio editor state"
          run_godot_test res://tools/smoke_arsenal_validation_edges.gd "Malformed ranged weapons ammunition enemies and saves"
          run_godot_test res://tools/smoke_boss_runtime.gd "Boss phases patterns reinforcements and durable outcomes"
          run_godot_test res://tools/smoke_boss_studio.gd "Boss and Phase Studio editor state"
          run_godot_test res://tools/smoke_boss_validation_edges.gd "Malformed boss arenas phases patterns rewards and reinforcements"
          run_godot_test res://tools/smoke_cinematic_runtime.gd "Cinematic playback skip and durable completion"
          run_godot_test res://tools/smoke_cinematic_studio.gd "Cinematic and Timeline Studio editor state"
          run_godot_test res://tools/smoke_cinematic_validation_edges.gd "Malformed cinematic maps steps targets effects and checkpoints"
