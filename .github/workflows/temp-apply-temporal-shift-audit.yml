name: Temporary Apply Temporal Shift Audit

on:
  push:
    branches:
      - agent/temporal-shift-audit

permissions:
  contents: write

concurrency:
  group: epochbound-temp-apply-temporal-shift-audit
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic integration edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              source = file_path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}: {old[:100]!r}")
              file_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/content/campaign_audit.gd",
              'const ProgressionAffordabilityAudit = preload("res://src/content/progression_affordability_audit.gd")\n\nconst PROBE_COUNT := 8',
              'const ProgressionAffordabilityAudit = preload("res://src/content/progression_affordability_audit.gd")\nconst TemporalShiftAudit = preload("res://src/content/temporal_shift_audit.gd")\n\nconst PROBE_COUNT := 9',
          )
          replace_once(
              "src/content/campaign_audit.gd",
              '\t\t"restorative_source_count": 0,\n\t\t"progression_item_count": 0,',
              '\t\t"restorative_source_count": 0,\n\t\t"multi_era_map_count": 0,\n\t\t"meaningful_shift_map_count": 0,\n\t\t"temporal_outcome_count": 0,\n\t\t"temporal_route_count": 0,\n\t\t"temporal_threat_count": 0,\n\t\t"temporal_information_count": 0,\n\t\t"temporal_relationship_count": 0,\n\t\t"temporal_resource_count": 0,\n\t\t"progression_item_count": 0,',
          )
          replace_once(
              "src/content/campaign_audit.gd",
              '\tprobe_save_policy(campaign, findings)\n\n\tvar source_finding_start := findings.size()',
              '\tprobe_save_policy(campaign, findings)\n\n\tvar temporal_metrics := TemporalShiftAudit.audit(maps, objects, findings)\n\tfor metric_name in [\n\t\t"multi_era_map_count",\n\t\t"meaningful_shift_map_count",\n\t\t"temporal_outcome_count",\n\t\t"temporal_route_count",\n\t\t"temporal_threat_count",\n\t\t"temporal_information_count",\n\t\t"temporal_relationship_count",\n\t\t"temporal_resource_count"\n\t]:\n\t\tmetrics[metric_name] = int(temporal_metrics.get(metric_name, 0))\n\n\tvar source_finding_start := findings.size()',
          )

          replace_once(
              "addons/epochbound_campaign_audit/campaign_audit_studio.gd",
              '\t)\n\tfor finding_value in report.get("findings", []):',
              '\t)\n\tmetrics_label.text += (\n\t\t"\\nTemporal maps %d/%d authored   •   Temporal outcomes %d   •   Route %d   •   Threat %d   •   Information %d   •   Relationship %d   •   Resource %d"\n\t\t% [\n\t\t\tint(metrics.get("meaningful_shift_map_count", 0)),\n\t\t\tint(metrics.get("multi_era_map_count", 0)),\n\t\t\tint(metrics.get("temporal_outcome_count", 0)),\n\t\t\tint(metrics.get("temporal_route_count", 0)),\n\t\t\tint(metrics.get("temporal_threat_count", 0)),\n\t\t\tint(metrics.get("temporal_information_count", 0)),\n\t\t\tint(metrics.get("temporal_relationship_count", 0)),\n\t\t\tint(metrics.get("temporal_resource_count", 0))\n\t\t]\n\t)\n\tfor finding_value in report.get("findings", []):',
          )

          replace_once(
              "tools/smoke_campaign_audit.gd",
              'check(int(first.get("probe_count", 0)) == 8, "Reference audit must execute all eight production probes.")',
              'check(int(first.get("probe_count", 0)) == 9, "Reference audit must execute all nine production probes.")',
          )
          replace_once(
              "tools/smoke_campaign_audit.gd",
              '\tcheck(\n\t\tint(metrics.get("progression_capability_count", 0)) == 1,',
              '\tcheck(int(metrics.get("multi_era_map_count", 0)) == 3, "Reference audit must inspect all three multi-era maps.")\n\tcheck(int(metrics.get("meaningful_shift_map_count", 0)) == 3, "Every reference map must author at least one meaningful temporal consequence.")\n\tcheck(int(metrics.get("temporal_outcome_count", 0)) >= 8, "Reference maps must publish bounded temporal consequence evidence.")\n\tcheck(int(metrics.get("temporal_route_count", 0)) >= 2, "Reference shifts must alter traversal in Bellweather and Clockwood.")\n\tcheck(int(metrics.get("temporal_threat_count", 0)) >= 3, "Reference shifts must alter threats across all three maps.")\n\tcheck(int(metrics.get("temporal_information_count", 0)) >= 3, "Reference shifts must expose different information across all three maps.")\n\tcheck(int(metrics.get("temporal_relationship_count", 0)) >= 2, "Reference shifts must alter NPC presence in Bellweather and Clockwood.")\n\tcheck(int(metrics.get("temporal_resource_count", 0)) >= 1, "Reference shifts must alter at least one authored resource source.")\n\tcheck(\n\t\tint(metrics.get("progression_capability_count", 0)) == 1,',
          )
          replace_once(
              "tools/smoke_campaign_audit.gd",
              'print("Reference release readiness smoke test passed: complete content and all eight campaign probes are deterministic with zero blockers, errors or warnings.")',
              'print("Reference release readiness smoke test passed: complete content and all nine campaign probes, including meaningful temporal shifts, are deterministic with zero blockers, errors or warnings.")',
          )

          replace_once(
              "tools/smoke_campaign_audit_edges.gd",
              '\t\t"orphan": {"id": "orphan", "connections": [], "interactions": [], "object_placements": []}',
              '\t\t"orphan": {\n\t\t\t"id": "orphan",\n\t\t\t"eras": [{"id": "verdant"}, {"id": "ashen"}],\n\t\t\t"connections": [],\n\t\t\t"interactions": [],\n\t\t\t"object_placements": []\n\t\t}',
          )
          replace_once(
              "tools/smoke_campaign_audit_edges.gd",
              'check(int(report.get("probe_count", 0)) == 8, "Synthetic audit must execute all eight probes.")',
              'check(int(report.get("probe_count", 0)) == 9, "Synthetic audit must execute all nine probes.")',
          )
          replace_once(
              "tools/smoke_campaign_audit_edges.gd",
              '\tcheck(has_code(report, "save.no_path"), "Campaigns without any save path must be reported.")',
              '\tcheck(has_code(report, "save.no_path"), "Campaigns without any save path must be reported.")\n\tcheck(has_code_context(report, "temporal.palette_only", "orphan"), "Multi-era maps with palette-only differences must be reported for temporal review.")',
          )

          replace_once(
              "tools/smoke_campaign_audit_studio.gd",
              'check(int(report.get("probe_count", 0)) == 8, "Audit Studio must expose all eight production probes.")',
              'check(int(report.get("probe_count", 0)) == 9, "Audit Studio must expose all nine production probes.")',
          )
          replace_once(
              "tools/smoke_campaign_audit_studio.gd",
              '\tcheck(int(metrics.get("renewable_stock_count", 0)) == 5, "Audit Studio report must preserve renewable stock evidence.")',
              '\tcheck(int(metrics.get("renewable_stock_count", 0)) == 5, "Audit Studio report must preserve renewable stock evidence.")\n\tcheck(int(metrics.get("multi_era_map_count", 0)) == 3, "Audit Studio report must inspect all three multi-era maps.")\n\tcheck(int(metrics.get("meaningful_shift_map_count", 0)) == 3, "Audit Studio report must preserve meaningful temporal evidence for every reference map.")',
          )
          replace_once(
              "tools/smoke_campaign_audit_studio.gd",
              '\t\tcheck(metrics_label.text.contains("Renewable stock 5"), "Audit Studio must display renewable-stock metrics.")',
              '\t\tcheck(metrics_label.text.contains("Renewable stock 5"), "Audit Studio must display renewable-stock metrics.")\n\t\tcheck(metrics_label.text.contains("Temporal maps 3/3 authored"), "Audit Studio must display meaningful temporal map coverage.")\n\t\tcheck(metrics_label.text.contains("Temporal outcomes"), "Audit Studio must display bounded temporal outcome evidence.")',
          )
          replace_once(
              "tools/smoke_campaign_audit_studio.gd",
              'check(int(exported.get("probe_count", 0)) == 8, "Exported report must preserve the expanded probe count.")',
              'check(int(exported.get("probe_count", 0)) == 9, "Exported report must preserve the expanded probe count.")',
          )
          replace_once(
              "tools/smoke_campaign_audit_studio.gd",
              'print("Campaign Audit Studio smoke test passed: selection, eight-probe progression metrics, supply evidence, rendering state and JSON export are coherent.")',
              'print("Campaign Audit Studio smoke test passed: selection, nine-probe progression and temporal metrics, supply evidence, rendering state and JSON export are coherent.")',
          )

          replace_once(
              "tools/compile_probe.gd",
              '\t"res://src/content/campaign_audit.gd",\n\t"res://src/content/progression_recipe_audit.gd",',
              '\t"res://src/content/campaign_audit.gd",\n\t"res://src/content/temporal_shift_audit.gd",\n\t"res://src/content/progression_recipe_audit.gd",',
          )
          replace_once(
              "tools/compile_probe.gd",
              '\t"res://tools/smoke_campaign_audit.gd",\n\t"res://tools/smoke_campaign_audit_studio.gd",',
              '\t"res://tools/smoke_campaign_audit.gd",\n\t"res://tools/smoke_temporal_shift_audit.gd",\n\t"res://tools/smoke_campaign_audit_studio.gd",',
          )

          replace_once(
              "scripts/validate.ps1",
              '        @("Run deterministic campaign production audit", "res://tools/audit_campaigns.gd"),',
              '        @("Run deterministic campaign production audit", "res://tools/audit_campaigns.gd"),\n        @("Smoke test meaningful temporal shift consequences", "res://tools/smoke_temporal_shift_audit.gd"),',
          )
          replace_once(
              "scripts/validate.ps1",
              'warning-safe editor plugin icons, leak-free headless shutdown, multi-source affordability, regional supply, scarcity, sprite-animation, environment and combat-readability validation',
              'warning-safe editor plugin icons, leak-free headless shutdown, meaningful temporal shifts, multi-source affordability, regional supply, scarcity, sprite-animation, environment and combat-readability validation',
          )

          replace_once(
              "docs/CAMPAIGN_AUDIT_STUDIO.md",
              "all eight audit probes",
              "all nine audit probes",
          )
          replace_once(
              "docs/CAMPAIGN_AUDIT_STUDIO.md",
              "## Eight permanent probes",
              "## Nine permanent probes",
          )
          replace_once(
              "docs/CAMPAIGN_AUDIT_STUDIO.md",
              "The report also publishes bounded metrics for maps, capabilities, quests, restorative sources, progression items, progression capabilities, source risks, merchant-only progression and affordability risks. These counts are evidence and triage aids, not balance scores.",
              "The report also publishes bounded metrics for maps, capabilities, quests, restorative sources, progression items, progression capabilities, source risks, merchant-only progression, affordability risks and meaningful temporal-shift evidence. These counts are evidence and triage aids, not balance scores.",
          )
          temporal_section = '''### 9. Temporal shift consequence

Every map with at least two declared eras must publish evidence that shifting changes the authored journey. The deterministic probe recognises five outcome categories:

- **route** — era-scoped terrain, collision, navigation, entries, connections or recovery anchors;
- **threat** — era-scoped enemies, encounter zones or boss phases;
- **information** — era-scoped interactions, companion cues or dialogue that differs between declared eras;
- **relationship** — era-scoped NPC or companion presence;
- **resource** — era-scoped pickups, merchants or companion rewards.

Finding:

- `temporal.palette_only` — warning

A warning means a multi-era map has no static evidence for a route, threat, information, relationship or resource consequence. Palette and landmark styling do not count as evidence. They remain important presentation layers, but they cannot satisfy the gameplay contract by themselves.

The category and evidence counts are intentionally bounded. They prove authored records exist; they do not claim that the shift is surprising, balanced or emotionally effective. Authors must still play the transition, verify that the consequence is reachable in the intended order and confirm the player can understand why shifting mattered.

'''
          replace_once(
              "docs/CAMPAIGN_AUDIT_STUDIO.md",
              "## Editor workflow",
              temporal_section + "## Editor workflow",
          )
          replace_once(
              "docs/CAMPAIGN_AUDIT_STUDIO.md",
              "Review the two-line metrics summary, including progression and affordability counts.",
              "Review the metrics summary, including progression, affordability and temporal consequence counts.",
          )
          replace_once(
              "docs/CAMPAIGN_AUDIT_STUDIO.md",
              "The source and affordability probes are deliberately conservative.",
              "The temporal probe measures authored evidence rather than experiential quality; a category count does not prove that a shift is obvious, fair or memorable. The source and affordability probes are deliberately conservative.",
          )

          replace_once(
              "docs/AUDIT_PLAYTEST_CHECKLIST.md",
              "all eight probes",
              "all nine probes",
          )
          checklist_section = '''## Temporal shift consequences

- Confirm **Temporal maps** reports every map with at least two declared eras.
- For each multi-era map, verify at least one route, threat, information, relationship or resource consequence is reachable in normal play.
- Confirm palette, lighting and landmark styling alone do not satisfy the automated probe.
- Review every `temporal.palette_only` warning and either author a meaningful consequence or remove the unsupported era state.
- Test both directions of each useful shift and confirm the player can understand what changed.
- Verify era-scoped routes preserve recovery anchors, companion recall and a valid return path.
- Verify era-scoped enemies and boss phases remain readable and cannot appear outside their authored era.
- Verify era-specific NPCs, clues, merchants and pickups preserve durable state when the player shifts away and back.

'''
          replace_once(
              "docs/AUDIT_PLAYTEST_CHECKLIST.md",
              "## Capability ordering",
              checklist_section + "## Capability ordering",
          )
          replace_once(
              "docs/AUDIT_PLAYTEST_CHECKLIST.md",
              "same eight-probe audit report as its source",
              "same nine-probe audit report as its source",
          )

          replace_once(
              "README.md",
              "16. Repository-wide campaign audits for reachability, capability definitions, progression sources, recipe unlocks and cycles, finite supply, merchant bindings, affordability, regional supply evidence, quest starts and save safety",
              "16. Repository-wide campaign audits with nine deterministic production probes for reachability, return safety, capability definitions, recovery, quest starts, save safety, progression sources, affordability and meaningful temporal-shift consequences, plus regional supply evidence",
          )
          replace_once(
              "README.md",
              "Runs eight deterministic production probes covering structural reachability, recovery, progression-source softlocks and merchant-only affordability, then adds regional supply evidence and exports machine-readable blocker and warning reports.",
              "Runs nine deterministic production probes covering structural reachability, recovery, progression-source softlocks, merchant-only affordability and meaningful temporal-shift consequences, then adds regional supply evidence and exports machine-readable blocker and warning reports.",
          )
          replace_once(
              "README.md",
              "repository-wide eight-probe campaign production audit with progression, affordability and supply evidence;",
              "repository-wide nine-probe campaign production audit with progression, affordability, meaningful temporal-shift consequences and supply evidence;",
          )
          replace_once(
              "README.md",
              "The primary receipt records zero reference content warnings, zero reference audit warnings and a passed warning-free release-readiness gate.",
              "The primary receipt records zero reference content warnings, zero reference audit warnings, passed meaningful temporal-shift validation and a passed warning-free release-readiness gate.",
          )
          replace_once(
              "README.md",
              "- Deterministic active-play clocks before wall-clock rewards",
              "- Deterministic active-play clocks before wall-clock rewards\n- Meaningful era consequences before palette-only shifts",
          )

          replace_once(
              "tools/check_release_workflow_policy.py",
              '        "python3 tools/check_release_workflow_policy.py",\n        "python3 tools/check_runtime_scene_contract.py",',
              '        "python3 tools/check_release_workflow_policy.py",\n        "python3 tools/check_temporal_shift_contract.py",\n        "python3 tools/check_runtime_scene_contract.py",',
          )
          replace_once(
              "tools/check_release_workflow_policy.py",
              '        \'"schemaVersion": "2.1"\',',
              '        \'"schemaVersion": "2.2"\',',
          )
          replace_once(
              "tools/check_release_workflow_policy.py",
              '        \'"headlessCleanupValidation": "passed"\',\n        \'"supplyRegionValidation": "passed"\',',
              '        \'"headlessCleanupValidation": "passed"\',\n        \'"temporalShiftValidation": "passed"\',\n        \'"supplyRegionValidation": "passed"\',',
          )
          replace_once(
              "tools/check_release_workflow_policy.py",
              '        "smoke_campaign_audit.gd",\n        "smoke_multiplayer_session_model.gd",',
              '        "smoke_campaign_audit.gd",\n        "smoke_temporal_shift_audit.gd",\n        "meaningful temporal shifts",\n        "smoke_multiplayer_session_model.gd",',
          )
          replace_once(
              "tools/check_release_workflow_policy.py",
              '        \'metrics.get("progression_source_risk_count", -1)) == 0\',\n        "zero blockers, errors or warnings",',
              '        \'metrics.get("progression_source_risk_count", -1)) == 0\',\n        \'metrics.get("multi_era_map_count", 0)\',\n        \'metrics.get("meaningful_shift_map_count", 0)\',\n        "all nine production probes",\n        "zero blockers, errors or warnings",',
          )
          replace_once(
              "tools/check_release_workflow_policy.py",
              '        \'progression_map.erase("interactions")\',\n    ],',
              '        \'progression_map.erase("interactions")\',\n        \'TemporalShiftAudit = preload("res://src/content/temporal_shift_audit.gd")\',\n        "PROBE_COUNT := 9",\n        \'TemporalShiftAudit.audit(maps, objects, findings)\',\n    ],',
          )
          replace_once(
              "tools/check_release_workflow_policy.py",
              "warning-safe editor icons, leak-free headless cleanup, warning-free reference readiness, progression affordability and regional supply entrypoints are guarded before Godot execution",
              "warning-safe editor icons, leak-free headless cleanup, meaningful temporal shifts, warning-free reference readiness, progression affordability and regional supply entrypoints are guarded before Godot execution",
          )
          PY

      - name: Verify and publish exact non-workflow edits
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/*.py
          rm -rf tools/__pycache__
          git diff --check
          cat > "${RUNNER_TEMP}/expected-files.txt" <<'FILES'
          README.md
          addons/epochbound_campaign_audit/campaign_audit_studio.gd
          docs/AUDIT_PLAYTEST_CHECKLIST.md
          docs/CAMPAIGN_AUDIT_STUDIO.md
          scripts/validate.ps1
          src/content/campaign_audit.gd
          tools/check_release_workflow_policy.py
          tools/compile_probe.gd
          tools/smoke_campaign_audit.gd
          tools/smoke_campaign_audit_edges.gd
          tools/smoke_campaign_audit_studio.gd
          FILES
          sort -o "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/expected-files.txt"
          git diff --name-only | sort > "${RUNNER_TEMP}/actual-files.txt"
          diff -u "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/actual-files.txt"
          git add --pathspec-from-file="${RUNNER_TEMP}/expected-files.txt"
          git diff --cached --check
          git config user.name "EVAVO Release Agent"
          git config user.email "evavo.studio@gmail.com"
          git commit -m "feat: audit meaningful temporal shift consequences [skip ci]"
          git push origin HEAD:agent/temporal-shift-audit
