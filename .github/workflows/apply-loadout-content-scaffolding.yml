name: Apply loadout content scaffolding

on:
  push:
    branches:
      - work/loadout-capability-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Add campaign defaults and reference gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/loadout-capability-foundation-20260729

      - name: Patch defaults and reference content
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(path_string: str, old: str, new: str) -> None:
              path = Path(path_string)
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path_string}: expected one occurrence, found {count}: {old[:120]!r}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "src/content/item_catalog.gd",
              '''\t\t\t{
          \t\t\t\t"id": "field_salve",
          \t\t\t\t"display_name": "Field Salve",
          \t\t\t\t"kind": "consumable",
          \t\t\t\t"description": "A warm salve mixed from metal salts and medicinal oil.",
          \t\t\t\t"stack_limit": 9,
          \t\t\t\t"value": 28,
          \t\t\t\t"use_effect": {"type": "heal", "amount": 16}
          \t\t\t}
          ''',
              '''\t\t\t{
          \t\t\t\t"id": "field_salve",
          \t\t\t\t"display_name": "Field Salve",
          \t\t\t\t"kind": "consumable",
          \t\t\t\t"description": "A warm salve mixed from metal salts and medicinal oil.",
          \t\t\t\t"stack_limit": 9,
          \t\t\t\t"value": 28,
          \t\t\t\t"use_effect": {"type": "heal", "amount": 16}
          \t\t\t},
          \t\t\t{
          \t\t\t\t"id": "trail_hook",
          \t\t\t\t"display_name": "Trail Hook",
          \t\t\t\t"kind": "equipment",
          \t\t\t\t"description": "A compact hooked field tool for roots, ropes and hardened growth.",
          \t\t\t\t"stack_limit": 1,
          \t\t\t\t"value": 24,
          \t\t\t\t"use_effect": {"type": "none"},
          \t\t\t\t"equipment": {
          \t\t\t\t\t"slot": "weapon",
          \t\t\t\t\t"attack_bonus": 1,
          \t\t\t\t\t"defense_bonus": 0,
          \t\t\t\t\t"max_health_bonus": 0,
          \t\t\t\t\t"move_speed_bonus": 0,
          \t\t\t\t\t"capabilities": ["cut_clockvines"]
          \t\t\t\t}
          \t\t\t},
          \t\t\t{
          \t\t\t\t"id": "field_coat",
          \t\t\t\t"display_name": "Field Coat",
          \t\t\t\t"kind": "equipment",
          \t\t\t\t"description": "A reinforced travelling coat with room for tools and emergency supplies.",
          \t\t\t\t"stack_limit": 1,
          \t\t\t\t"value": 32,
          \t\t\t\t"use_effect": {"type": "none"},
          \t\t\t\t"equipment": {
          \t\t\t\t\t"slot": "body",
          \t\t\t\t\t"attack_bonus": 0,
          \t\t\t\t\t"defense_bonus": 1,
          \t\t\t\t\t"max_health_bonus": 2,
          \t\t\t\t\t"move_speed_bonus": 0,
          \t\t\t\t\t"capabilities": []
          \t\t\t\t}
          \t\t\t},
          \t\t\t{
          \t\t\t\t"id": "trail_lantern",
          \t\t\t\t"display_name": "Trail Lantern",
          \t\t\t\t"kind": "equipment",
          \t\t\t\t"description": "A hooded lantern suitable for enclosed roads and forgotten structures.",
          \t\t\t\t"stack_limit": 1,
          \t\t\t\t"value": 20,
          \t\t\t\t"use_effect": {"type": "none"},
          \t\t\t\t"equipment": {
          \t\t\t\t\t"slot": "tool",
          \t\t\t\t\t"attack_bonus": 0,
          \t\t\t\t\t"defense_bonus": 0,
          \t\t\t\t\t"max_health_bonus": 0,
          \t\t\t\t\t"move_speed_bonus": 0,
          \t\t\t\t\t"capabilities": ["illuminate_dark"]
          \t\t\t\t}
          \t\t\t}
          ''',
          )

          replace_once(
              "src/content/campaign_repository.gd",
              '''\tvar story_catalog_path := campaign_directory.path_join("story").path_join("core.json")
          \tvar story_catalog_result := save_json(story_catalog_path, StoryCatalog.default_story_catalog())
          \tif not story_catalog_result.get("ok", false):
          \t\treturn story_catalog_result
          \tvar map_id := "first_crossing"
          ''',
              '''\tvar story_catalog_path := campaign_directory.path_join("story").path_join("core.json")
          \tvar story_catalog_result := save_json(story_catalog_path, StoryCatalog.default_story_catalog())
          \tif not story_catalog_result.get("ok", false):
          \t\treturn story_catalog_result
          \tvar capability_catalog_path := campaign_directory.path_join("capabilities").path_join("core.json")
          \tvar capability_catalog_result := save_json(capability_catalog_path, default_capability_catalog())
          \tif not capability_catalog_result.get("ok", false):
          \t\treturn capability_catalog_result
          \tvar map_id := "first_crossing"
          ''',
          )
          replace_once(
              "src/content/campaign_repository.gd",
              '''\t\t"story_catalog_path": story_catalog_path,
          \t\t"map_path": map_path,
          ''',
              '''\t\t"story_catalog_path": story_catalog_path,
          \t\t"capability_catalog_path": capability_catalog_path,
          \t\t"map_path": map_path,
          ''',
          )
          replace_once(
              "src/content/campaign_repository.gd",
              '''\t\t"story_files": ["story/core.json"],
          \t\t"save_policy": {
          ''',
              '''\t\t"story_files": ["story/core.json"],
          \t\t"capability_files": ["capabilities/core.json"],
          \t\t"equipment_slots": [
          \t\t\t{"id": "weapon", "display_name": "Weapon"},
          \t\t\t{"id": "body", "display_name": "Body"},
          \t\t\t{"id": "tool", "display_name": "Tool"}
          \t\t],
          \t\t"starting_equipment": {
          \t\t\t"weapon": "trail_hook",
          \t\t\t"body": "field_coat",
          \t\t\t"tool": "trail_lantern"
          \t\t},
          \t\t"base_capabilities": [],
          \t\t"save_policy": {
          ''',
          )
          replace_once(
              "src/content/campaign_repository.gd",
              '''\t\t"starting_inventory": [
          \t\t\t{"item_id": "trail_tonic", "quantity": 1},
          \t\t\t{"item_id": "brass_scrap", "quantity": 2}
          \t\t],
          ''',
              '''\t\t"starting_inventory": [
          \t\t\t{"item_id": "trail_tonic", "quantity": 1},
          \t\t\t{"item_id": "brass_scrap", "quantity": 2},
          \t\t\t{"item_id": "trail_hook", "quantity": 1},
          \t\t\t{"item_id": "field_coat", "quantity": 1},
          \t\t\t{"item_id": "trail_lantern", "quantity": 1}
          \t\t],
          ''',
          )
          replace_once(
              "src/content/campaign_repository.gd",
              '''static func default_map(map_id: String, display_name: String) -> Dictionary:
          ''',
              '''static func default_capability_catalog() -> Dictionary:
          \treturn {
          \t\t"schema_version": 1,
          \t\t"capabilities": [
          \t\t\t{
          \t\t\t\t"id": "illuminate_dark",
          \t\t\t\t"display_name": "Illuminate Darkness",
          \t\t\t\t"description": "Allows the player to enter and interpret spaces beyond ordinary ambient light."
          \t\t\t},
          \t\t\t{
          \t\t\t\t"id": "cut_clockvines",
          \t\t\t\t"display_name": "Cut Clockvines",
          \t\t\t\t"description": "Allows a suitable tool to cut fibrous growth hardened by displaced time."
          \t\t\t},
          \t\t\t{
          \t\t\t\t"id": "clockglass_sight",
          \t\t\t\t"display_name": "Clockglass Sight",
          \t\t\t\t"description": "Reveals seams and inscriptions hidden beneath an object's remembered surface."
          \t\t\t}
          \t\t]
          \t}


          static func default_map(map_id: String, display_name: String) -> Dictionary:
          ''',
          )

          bell_path = Path("campaigns/epochbound_demo/maps/bellweather_crossing.json")
          bell = json.loads(bell_path.read_text(encoding="utf-8"))
          if not any(entry.get("id") == "from_underworks" for entry in bell.get("entry_points", [])):
              bell.setdefault("entry_points", []).append({
                  "id": "from_underworks",
                  "player": {"x": 528, "y": 272},
                  "companion": {"x": 496, "y": 286},
                  "available_eras": []
              })
          if not any(connection.get("id") == "stairs_to_underworks" for connection in bell.get("connections", [])):
              bell.setdefault("connections", []).append({
                  "id": "stairs_to_underworks",
                  "position": {"x": 548, "y": 272},
                  "radius": 34,
                  "target_map": "museum_underworks",
                  "target_entry": "from_bellweather",
                  "target_era": "same",
                  "trigger": "interact",
                  "available_eras": [],
                  "required_capabilities": ["illuminate_dark"],
                  "blocked_dialogue": "The service stairs disappear into absolute darkness. Eli needs a dependable light before taking Morrow below."
              })
          bell_path.write_text(json.dumps(bell, indent="\t", ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")

          story_path = Path("campaigns/epochbound_demo/story/core.json")
          story = json.loads(story_path.read_text(encoding="utf-8"))
          for quest in story.get("quests", []):
              if quest.get("id") != "the_missing_hour":
                  continue
              rewards = quest.setdefault("rewards", [])
              if not any(reward.get("type") == "grant_item" and reward.get("item_id") == "archivist_lens" for reward in rewards if isinstance(reward, dict)):
                  rewards.insert(1, {"type": "grant_item", "item_id": "archivist_lens", "quantity": 1})
          story_path.write_text(json.dumps(story, indent="\t", ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")

          replace_once(
              "addons/epochbound_item_forge/item_forge_studio.gd",
              '''\tfor entry_value in ItemCatalog.starting_inventory(active_campaign):
          \t\tvar entry: Dictionary = entry_value
          \t\tif str(entry.get("item_id", "")) == item_id:
          \t\t\tusages.append("starting inventory")
          ''',
              '''\tfor entry_value in ItemCatalog.starting_inventory(active_campaign):
          \t\tvar entry: Dictionary = entry_value
          \t\tif str(entry.get("item_id", "")) == item_id:
          \t\t\tusages.append("starting inventory")
          \tvar starting_equipment_value: Variant = active_campaign.get("starting_equipment", {})
          \tif typeof(starting_equipment_value) == TYPE_DICTIONARY:
          \t\tfor equipped_value in (starting_equipment_value as Dictionary).values():
          \t\t\tif str(equipped_value) == item_id:
          \t\t\t\tusages.append("starting equipment")
          ''',
          )

          Path(".github/workflows/apply-loadout-content-scaffolding.yml").unlink()

      - name: Commit scaffolding and reference progression
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/item_catalog.gd src/content/campaign_repository.gd campaigns/epochbound_demo/maps/bellweather_crossing.json campaigns/epochbound_demo/story/core.json addons/epochbound_item_forge/item_forge_studio.gd .github/workflows/apply-loadout-content-scaffolding.yml
          git commit -m "feat: scaffold equipment campaigns and reference gates"
          git push origin HEAD:work/loadout-capability-foundation-20260729
