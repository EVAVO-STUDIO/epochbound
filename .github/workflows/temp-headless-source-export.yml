name: Temporary Headless Runtime Cleanup Validation

on:
  push:
    branches:
      - agent/headless-cleanup

permissions:
  contents: write

concurrency:
  group: epochbound-temp-headless-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
      GODOT_BINARY: Godot_v4.6.2-stable_linux.x86_64
      GODOT_RELEASE_URL: https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable
      TARGET_BRANCH: agent/headless-cleanup
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm exact clean source
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "${TARGET_BRANCH}" ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Wire representative runtime test through bounded cleanup
        shell: python
        run: |
          from pathlib import Path
          path = Path("tools/smoke_runtime_scene_contract.gd")
          source = path.read_text(encoding="utf-8")
          preload_anchor = 'const RuntimeSceneContract = preload("res://src/game/runtime_scene_contract.gd")\n'
          cleanup_anchor = '\troot.remove_child(runtime)\n\truntime.free()\n\tfinish()\n'
          if 'const HeadlessRuntimeCleanup' not in source:
              if preload_anchor not in source:
                  raise SystemExit("runtime contract preload anchor missing")
              source = source.replace(
                  preload_anchor,
                  preload_anchor + 'const HeadlessRuntimeCleanup = preload("res://tools/headless_runtime_cleanup.gd")\n',
                  1,
              )
          if cleanup_anchor not in source:
              raise SystemExit("runtime contract cleanup anchor missing")
          source = source.replace(
              cleanup_anchor,
              '\tawait HeadlessRuntimeCleanup.release(self, runtime)\n\tfinish()\n',
              1,
          )
          path.write_text(source, encoding="utf-8")

      - name: Download and verify official Godot 4.6.2 editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin .godot-download
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output .godot-download/SHA512-SUMS.txt \
            "${GODOT_RELEASE_URL}/SHA512-SUMS.txt"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output ".godot-download/${GODOT_ARCHIVE}" \
            "${GODOT_RELEASE_URL}/${GODOT_ARCHIVE}"
          grep -F "  ${GODOT_ARCHIVE}" .godot-download/SHA512-SUMS.txt \
            > .godot-download/selected-SHA512-SUMS.txt
          (cd .godot-download && sha512sum --check selected-SHA512-SUMS.txt)
          unzip -q ".godot-download/${GODOT_ARCHIVE}" -d .godot-bin
          mv ".godot-bin/${GODOT_BINARY}" .godot-bin/godot
          chmod +x .godot-bin/godot
          [[ "$(.godot-bin/godot --version)" =~ ^4\.6\.2 ]]

      - name: Prove representative runtime exits without leaked objects
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/headless-runtime-cleanup.log"
          .godot-bin/godot --headless --verbose --path "$GITHUB_WORKSPACE" \
            --script res://tools/smoke_runtime_scene_contract.gd 2>&1 | tee "${log}"
          grep -F "Runtime scene contract smoke test passed" "${log}"
          if grep -F "ObjectDB instances leaked at exit" "${log}"; then
            echo "Representative runtime still leaked objects" >&2
            exit 1
          fi
          if grep -F "SCRIPT ERROR:" "${log}" || grep -E '^ERROR:' "${log}"; then
            echo "Representative runtime emitted a parser or runtime error" >&2
            exit 1
          fi

      - name: Commit and push validated representative cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          [[ "${changed}" == "tools/smoke_runtime_scene_contract.gd" ]]
          git add -- tools/smoke_runtime_scene_contract.gd
          git config user.name "EVAVO Release Agent"
          git config user.email "evavo.studio@gmail.com"
          git commit -m "test: cleanly release representative runtime [skip ci]"
          [[ -z "$(git status --porcelain=v1 --untracked-files=no)" ]]
          git push origin "HEAD:${TARGET_BRANCH}"
