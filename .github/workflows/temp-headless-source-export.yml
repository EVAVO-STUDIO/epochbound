name: Temporary Minimal Audio Leak Probe

on:
  push:
    branches:
      - agent/headless-cleanup

permissions:
  contents: read

concurrency:
  group: epochbound-temp-headless-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
      GODOT_BINARY: Godot_v4.6.2-stable_linux.x86_64
      GODOT_RELEASE_URL: https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm exact clean source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Create isolated generator playback cleanup probe
        shell: python
        run: |
          from pathlib import Path
          source = "extends SceneTree\n\nfunc _initialize() -> void:\n\tcall_deferred(\"run_probe\")\n\nfunc run_probe() -> void:\n\tvar player := AudioStreamPlayer.new()\n\tplayer.name = \"Probe\"\n\tvar generator := AudioStreamGenerator.new()\n\tgenerator.mix_rate = 22050.0\n\tgenerator.buffer_length = 0.35\n\tplayer.stream = generator\n\troot.add_child(player)\n\tplayer.play()\n\tawait process_frame\n\tvar playback := player.get_stream_playback() as AudioStreamGeneratorPlayback\n\tif playback != null:\n\t\tplayback.push_frame(Vector2.ZERO)\n\t\tplayback.clear_buffer()\n\tplayback = null\n\tplayer.stop()\n\tplayer.stream_paused = true\n\tplayer.stream = null\n\troot.remove_child(player)\n\tplayer.free()\n\tplayer = null\n\tgenerator = null\n\tfor _frame_index in range(30):\n\t\tawait process_frame\n\tawait create_timer(0.25).timeout\n\tprint(\"Minimal generator cleanup probe passed.\")\n\tcall_deferred(\"quit\", 0)\n"
          Path("tools/temp_audio_leak_probe.gd").write_text(source, encoding="utf-8")

      - name: Download and verify official Godot 4.6.2 editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin .godot-download
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output .godot-download/SHA512-SUMS.txt \
            "${GODOT_RELEASE_URL}/SHA512-SUMS.txt"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output ".godot-download/${GODOT_ARCHIVE}" \
            "${GODOT_RELEASE_URL}/${GODOT_ARCHIVE}"
          grep -F "  ${GODOT_ARCHIVE}" .godot-download/SHA512-SUMS.txt \
            > .godot-download/selected-SHA512-SUMS.txt
          (cd .godot-download && sha512sum --check selected-SHA512-SUMS.txt)
          unzip -q ".godot-download/${GODOT_ARCHIVE}" -d .godot-bin
          mv ".godot-bin/${GODOT_BINARY}" .godot-bin/godot
          chmod +x .godot-bin/godot
          [[ "$(.godot-bin/godot --version)" =~ ^4\.6\.2 ]]

      - name: Classify the minimal AudioStreamGenerator cleanup
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/minimal-audio-leak.log"
          .godot-bin/godot --headless --verbose --path "$GITHUB_WORKSPACE" \
            --script res://tools/temp_audio_leak_probe.gd 2>&1 | tee "${log}"
          grep -F "Minimal generator cleanup probe passed" "${log}"
          if grep -F "ObjectDB instances leaked at exit" "${log}"; then
            echo "Minimal Godot AudioStreamGenerator playback still leaks under the dummy backend" >&2
            exit 1
          fi
