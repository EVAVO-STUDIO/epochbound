name: Apply economy integration

on:
  push:
    branches:
      - work/merchant-economy-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Wire economy contracts into existing systems
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/merchant-economy-foundation-20260729

      - name: Apply reviewed integration changes
        shell: python
        run: |
          import json
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected one occurrence, found {count}: {old!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          # Story types consume the same durable wallet used by merchants.
          replace_once(
              "src/content/story_catalog.gd",
              '\t"clock_shards_at_least"\n]',
              '\t"clock_shards_at_least",\n\t"currency_at_least"\n]'
          )
          replace_once(
              "src/content/story_catalog.gd",
              '\t"grant_clock_shards",\n\t"message"\n]',
              '\t"grant_clock_shards",\n\t"grant_currency",\n\t"remove_currency",\n\t"message"\n]'
          )
          replace_once(
              "src/game/story_model.gd",
              '''\t\t"clock_shards_at_least":
          \t\t\treturn int(context.get("clock_shards", 0)) >= maxi(0, int(condition.get("amount", 0)))
          \t\t_:
          ''',
              '''\t\t"clock_shards_at_least":
          \t\t\treturn int(context.get("clock_shards", 0)) >= maxi(0, int(condition.get("amount", 0)))
          \t\t"currency_at_least":
          \t\t\tvar balances: Dictionary = context.get("currency_balances", {})
          \t\t\treturn int(balances.get(str(condition.get("currency_id", "")), 0)) >= maxi(0, int(condition.get("amount", 0)))
          \t\t_:
          '''
          )

          # Save schema 3 adds deterministic wallet and merchant-stock state.
          replace_once("src/content/save_profile.gd", "const CURRENT_SCHEMA := 2", "const CURRENT_SCHEMA := 3")
          replace_once(
              "src/content/save_profile.gd",
              '''\tvar normalised_payload := payload.duplicate(true)
          \tif typeof(normalised_payload.get("equipment")) != TYPE_DICTIONARY:
          \t\tnormalised_payload["equipment"] = {}
          \tvar profile := {
          ''',
              '''\tvar normalised_payload := payload.duplicate(true)
          \tif typeof(normalised_payload.get("equipment")) != TYPE_DICTIONARY:
          \t\tnormalised_payload["equipment"] = {}
          \tif typeof(normalised_payload.get("currency_balances")) != TYPE_DICTIONARY:
          \t\tnormalised_payload["currency_balances"] = {}
          \tif typeof(normalised_payload.get("merchant_stock")) != TYPE_DICTIONARY:
          \t\tnormalised_payload["merchant_stock"] = {}
          \tif typeof(normalised_payload.get("economy_initialized")) != TYPE_BOOL:
          \t\tnormalised_payload["economy_initialized"] = false
          \tvar profile := {
          '''
          )
          version_two = '''
          \tif version == 2:
          \t\tif not checksum_valid(raw_profile):
          \t\t\treturn {
          \t\t\t\t"ok": false,
          \t\t\t\t"profile": {},
          \t\t\t\t"migrated": false,
          \t\t\t\t"from_version": version,
          \t\t\t\t"errors": ["Legacy schema 2 checksum is missing or invalid."]
          \t\t\t}
          \t\tvar metadata := dictionary_or_empty(raw_profile.get("metadata", {}))
          \t\tvar payload := dictionary_or_empty(raw_profile.get("payload", {}))
          \t\tpayload["equipment"] = dictionary_or_empty(payload.get("equipment", {}))
          \t\tpayload["currency_balances"] = {}
          \t\tpayload["merchant_stock"] = {}
          \t\tpayload["economy_initialized"] = false
          \t\tvar migrated_profile := build_profile(
          \t\t\tstr(raw_profile.get("campaign_id", "")),
          \t\t\tstr(raw_profile.get("slot_id", "slot_1")),
          \t\t\tmetadata,
          \t\t\tpayload
          \t\t)
          \t\treturn {
          \t\t\t"ok": true,
          \t\t\t"profile": migrated_profile,
          \t\t\t"migrated": true,
          \t\t\t"from_version": version,
          \t\t\t"errors": []
          \t\t}
          '''
          replace_once(
              "src/content/save_profile.gd",
              "\n\tif version == 1:\n",
              version_two + "\n\tif version == 1:\n"
          )
          replace_once(
              "src/content/save_profile.gd",
              '''\t\tpayload["equipment"] = dictionary_or_empty(payload.get("equipment", {}))
          \t\tvar migrated_profile := build_profile(
          ''',
              '''\t\tpayload["equipment"] = dictionary_or_empty(payload.get("equipment", {}))
          \t\tpayload["currency_balances"] = {}
          \t\tpayload["merchant_stock"] = {}
          \t\tpayload["economy_initialized"] = false
          \t\tvar migrated_profile := build_profile(
          '''
          )
          replace_once(
              "src/content/save_profile.gd",
              '''\t\t\t"equipment": dictionary_or_empty(raw_profile.get("equipment", {})),
          \t\t\t"companion_command": "follow",
          ''',
              '''\t\t\t"equipment": dictionary_or_empty(raw_profile.get("equipment", {})),
          \t\t\t"currency_balances": {},
          \t\t\t"merchant_stock": {},
          \t\t\t"economy_initialized": false,
          \t\t\t"companion_command": "follow",
          '''
          )
          replace_once(
              "src/content/save_profile.gd",
              '''\telse:
          \t\tpayload["equipment"] = dictionary_or_empty(payload.get("equipment", {}))
          \tvar migrated := build_profile(campaign_id, slot_id, metadata, payload)
          ''',
              '''\telse:
          \t\tpayload["equipment"] = dictionary_or_empty(payload.get("equipment", {}))
          \t\tpayload["currency_balances"] = {}
          \t\tpayload["merchant_stock"] = {}
          \t\tpayload["economy_initialized"] = false
          \tvar migrated := build_profile(campaign_id, slot_id, metadata, payload)
          '''
          )
          replace_once(
              "src/content/save_profile.gd",
              '''\tfor field in ["inventory", "session_state", "quest_progress", "equipment"]:
          ''',
              '''\tfor field in ["inventory", "session_state", "quest_progress", "equipment", "currency_balances", "merchant_stock"]:
          '''
          )
          replace_once(
              "src/content/save_profile.gd",
              '''\tvar command := str(payload.get("companion_command", "follow"))
          ''',
              '''\tif typeof(payload.get("economy_initialized", false)) != TYPE_BOOL:
          \t\terrors.append("Save payload economy_initialized must be boolean.")
          \tvar command := str(payload.get("companion_command", "follow"))
          '''
          )
          replace_once(
              "src/content/save_profile.gd",
              '''\tvar equipment_value: Variant = payload.get("equipment", {})
          \tvar equipment: Dictionary = equipment_value if typeof(equipment_value) == TYPE_DICTIONARY else {}
          ''',
              '''\tvar equipment_value: Variant = payload.get("equipment", {})
          \tvar equipment: Dictionary = equipment_value if typeof(equipment_value) == TYPE_DICTIONARY else {}
          \tvar balances_value: Variant = payload.get("currency_balances", {})
          \tvar balances: Dictionary = balances_value if typeof(balances_value) == TYPE_DICTIONARY else {}
          \tvar stock_value: Variant = payload.get("merchant_stock", {})
          \tvar stock: Dictionary = stock_value if typeof(stock_value) == TYPE_DICTIONARY else {}
          '''
          )
          replace_once(
              "src/content/save_profile.gd",
              '''\t\t"equipment_slots": equipment.size(),
          \t\t"active_quests": active_quests,
          ''',
              '''\t\t"equipment_slots": equipment.size(),
          \t\t"currency_wallets": balances.size(),
          \t\t"merchant_records": stock.size(),
          \t\t"active_quests": active_quests,
          '''
          )

          # New campaign scaffolding creates a complete economy catalogue.
          replace_once(
              "src/content/campaign_repository.gd",
              'const StoryCatalog = preload("res://src/content/story_catalog.gd")\n',
              'const StoryCatalog = preload("res://src/content/story_catalog.gd")\nconst EconomyCatalog = preload("res://src/content/economy_catalog.gd")\n'
          )
          replace_once(
              "src/content/campaign_repository.gd",
              '''\tvar capability_catalog_path := campaign_directory.path_join("capabilities").path_join("core.json")
          \tvar capability_catalog_result := save_json(capability_catalog_path, default_capability_catalog())
          \tif not capability_catalog_result.get("ok", false):
          \t\treturn capability_catalog_result
          \tvar map_id := "first_crossing"
          ''',
              '''\tvar capability_catalog_path := campaign_directory.path_join("capabilities").path_join("core.json")
          \tvar capability_catalog_result := save_json(capability_catalog_path, default_capability_catalog())
          \tif not capability_catalog_result.get("ok", false):
          \t\treturn capability_catalog_result
          \tvar economy_catalog_path := campaign_directory.path_join("economy").path_join("core.json")
          \tvar economy_catalog_result := save_json(economy_catalog_path, EconomyCatalog.default_catalog())
          \tif not economy_catalog_result.get("ok", false):
          \t\treturn economy_catalog_result
          \tvar map_id := "first_crossing"
          '''
          )
          replace_once(
              "src/content/campaign_repository.gd",
              '''\t\t"capability_catalog_path": capability_catalog_path,
          \t\t"map_path": map_path,
          ''',
              '''\t\t"capability_catalog_path": capability_catalog_path,
          \t\t"economy_catalog_path": economy_catalog_path,
          \t\t"map_path": map_path,
          '''
          )
          replace_once(
              "src/content/campaign_repository.gd",
              '''\t\t"capability_files": ["capabilities/core.json"],
          \t\t"equipment_slots": [
          ''',
              '''\t\t"capability_files": ["capabilities/core.json"],
          \t\t"economy_files": ["economy/core.json"],
          \t\t"equipment_slots": [
          '''
          )

          # Enable the ninth main-screen plugin.
          project = Path("project.godot")
          project_text = project.read_text(encoding="utf-8")
          plugin = '"res://addons/epochbound_trade_studio/plugin.cfg"'
          if plugin not in project_text:
              marker = '"res://addons/epochbound_loadout_studio/plugin.cfg")'
              if marker not in project_text:
                  raise SystemExit("project.godot: loadout plugin marker not found")
              project_text = project_text.replace(marker, '"res://addons/epochbound_loadout_studio/plugin.cfg", ' + plugin + ')', 1)
              project.write_text(project_text, encoding="utf-8", newline="\n")

          # Reference campaign and content.
          campaign_path = Path("campaigns/epochbound_demo/campaign.json")
          campaign = json.loads(campaign_path.read_text(encoding="utf-8"))
          campaign["economy_files"] = ["economy/core.json"]
          campaign_path.write_text(json.dumps(campaign, indent="\t", ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")

          items_path = Path("campaigns/epochbound_demo/items/core.json")
          items = json.loads(items_path.read_text(encoding="utf-8"))
          if not any(item.get("id") == "salvager_wrap" for item in items["items"]):
              items["items"].append({
                  "id": "salvager_wrap",
                  "display_name": "Underworks Salvager Wrap",
                  "kind": "equipment",
                  "description": "A close-fitted work wrap reinforced with clockvine fibre and thin brass plates recovered below the museum.",
                  "stack_limit": 1,
                  "value": 64,
                  "use_effect": {"type": "none"},
                  "equipment": {
                      "slot": "body",
                      "attack_bonus": 0,
                      "defense_bonus": 2,
                      "max_health_bonus": 0,
                      "move_speed_bonus": 4,
                      "capabilities": []
                  }
              })
          items_path.write_text(json.dumps(items, indent="\t", ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")

          objects_path = Path("campaigns/epochbound_demo/objects/core.json")
          objects = json.loads(objects_path.read_text(encoding="utf-8"))
          new_objects = [
              {
                  "id": "museum_provisioner",
                  "display_name": "Bellweather Provisioner",
                  "kind": "npc",
                  "appearance": {"shape": "person", "color": "635a48", "accent": "e0c47e"},
                  "solid": True,
                  "collision_radius": 9,
                  "interaction_radius": 46,
                  "merchant_id": "bellweather_provisions",
                  "dialogue": {
                      "verdant": "The provisioner counts archive chits against a till that rings one second late.",
                      "ashen": "The provisioner remains behind the blackened counter, pricing each item by what survived the fire.",
                      "default": "The old museum till is open for trade."
                  }
              },
              {
                  "id": "underworks_salvager",
                  "display_name": "Underworks Salvager",
                  "kind": "npc",
                  "appearance": {"shape": "person", "color": "4b5657", "accent": "d28b58"},
                  "solid": True,
                  "collision_radius": 9,
                  "interaction_radius": 46,
                  "merchant_id": "underworks_exchange",
                  "merchant_blocked_dialogue": "Without a steady light, the salvager will not open the lower exchange.",
                  "dialogue": "The salvager weighs objects by how many histories they can survive."
              }
          ]
          existing = {item.get("id") for item in objects["objects"]}
          objects["objects"].extend(item for item in new_objects if item["id"] not in existing)
          objects_path.write_text(json.dumps(objects, indent="\t", ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")

          bell_path = Path("campaigns/epochbound_demo/maps/bellweather_crossing.json")
          bell = json.loads(bell_path.read_text(encoding="utf-8"))
          if not any(p.get("id") == "crossing_provisioner" for p in bell["object_placements"]):
              bell["object_placements"].append({
                  "id": "crossing_provisioner",
                  "object_id": "museum_provisioner",
                  "position": {"x": 304, "y": 184},
                  "facing": "down",
                  "available_eras": [],
                  "state_key": "bellweather:provisioner"
              })
          bell_path.write_text(json.dumps(bell, indent="\t", ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")

          under_path = Path("campaigns/epochbound_demo/maps/museum_underworks.json")
          under = json.loads(under_path.read_text(encoding="utf-8"))
          if not any(p.get("id") == "underworks_salvager" for p in under["object_placements"]):
              under["object_placements"].append({
                  "id": "underworks_salvager",
                  "object_id": "underworks_salvager",
                  "position": {"x": 240, "y": 224},
                  "facing": "right",
                  "available_eras": [],
                  "state_key": "underworks:salvager"
              })
          under_path.write_text(json.dumps(under, indent="\t", ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")

          story_path = Path("campaigns/epochbound_demo/story/core.json")
          story = json.loads(story_path.read_text(encoding="utf-8"))
          quiet = next(quest for quest in story["quests"] if quest.get("id") == "quiet_the_hunt")
          if not any(effect.get("type") == "grant_currency" for effect in quiet["rewards"]):
              quiet["rewards"].append({"type": "grant_currency", "currency_id": "archive_chits", "amount": 12})
          story_path.write_text(json.dumps(story, indent="\t", ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")

          Path(".github/workflows/apply-economy-integration.yml").unlink()

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate merchant economy across campaign systems"
          git push origin HEAD:work/merchant-economy-foundation-20260729
