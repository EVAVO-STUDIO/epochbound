name: Temporary Editor Plugin Reliability Validation

on:
  push:
    branches:
      - agent/next-production-hardening

permissions:
  contents: write

concurrency:
  group: epochbound-temp-editor-plugin-reliability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
      GODOT_BINARY: Godot_v4.6.2-stable_linux.x86_64
      GODOT_RELEASE_URL: https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable
      PATCH_SHA256: 304d83ac0ecbc26c9605fb3a7f6a45eb5d889606f45fffc669a2bf61a0ef2dd9
      PATCH_XZ_SHA256: 8ee29daa1160421f9bd4165cc28ff823a6a4dd9eb262123046567d67b3ca0d6e
      TARGET_BRANCH: agent/next-production-hardening

    steps:
      - name: Check out exact branch candidate
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "${TARGET_BRANCH}" ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Decode and apply exact editor plugin reliability patch
        shell: bash
        run: |
          set -euo pipefail
          archive_path="${RUNNER_TEMP}/editor-plugin-reliability.patch.xz"
          patch_path="${RUNNER_TEMP}/editor-plugin-reliability.patch"
          cat .evavo/editor-plugin-reliability.patch.xz.part* > "${archive_path}"
          echo "${PATCH_XZ_SHA256}  ${archive_path}" | sha256sum --check --strict
          xz --decompress --stdout "${archive_path}" > "${patch_path}"
          echo "${PATCH_SHA256}  ${patch_path}" | sha256sum --check --strict
          git apply --check "${patch_path}"
          git apply "${patch_path}"
          git diff --check

      - name: Run fail-closed source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/*.py
          python3 tools/check_release_workflow_policy.py
          python3 tools/check_runtime_scene_contract.py
          python3 tools/check_player_settings_contract.py
          python3 tools/check_supply_region_contract.py
          python3 tools/check_canonical_journey_contract.py
          python3 tools/check_multiplayer_contract.py
          python3 tools/check_multiplayer_connection_contract.py
          python3 tools/check_multiplayer_loopback_contract.py
          python3 tools/check_sprite_animation_contract.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("campaigns").rglob("*.json")):
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
          print("all_campaign_json_parsed")
          PY

      - name: Download and verify official Godot 4.6.2 editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin .godot-download
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output .godot-download/SHA512-SUMS.txt \
            "${GODOT_RELEASE_URL}/SHA512-SUMS.txt"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output ".godot-download/${GODOT_ARCHIVE}" \
            "${GODOT_RELEASE_URL}/${GODOT_ARCHIVE}"
          grep -F "  ${GODOT_ARCHIVE}" .godot-download/SHA512-SUMS.txt \
            > .godot-download/selected-SHA512-SUMS.txt
          (cd .godot-download && sha512sum --check selected-SHA512-SUMS.txt)
          unzip -q ".godot-download/${GODOT_ARCHIVE}" -d .godot-bin
          mv ".godot-bin/${GODOT_BINARY}" .godot-bin/godot
          chmod +x .godot-bin/godot
          version="$(.godot-bin/godot --version)"
          [[ "${version}" =~ ^4\.6\.2 ]] || { echo "Unexpected Godot version: ${version}" >&2; exit 1; }
          command -v pwsh >/dev/null || { echo "PowerShell is required" >&2; exit 1; }
          rm -rf .godot-download

      - name: Compile complete runtime and authoring surface
        shell: bash
        run: |
          set -euo pipefail
          .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" \
            --script res://tools/compile_probe.gd

      - name: Prove warning-safe editor plugin icon resolution
        shell: bash
        run: |
          set -euo pipefail
          icon_log="${RUNNER_TEMP}/editor-plugin-icons.log"
          .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" \
            --script res://tools/smoke_editor_plugin_icons.gd 2>&1 | tee "${icon_log}"
          grep -F "Editor plugin icon smoke test passed" "${icon_log}"
          if grep -F "Trying to access a non-existing editor theme icon" "${icon_log}"; then
            echo "Missing editor theme icon warning returned" >&2
            exit 1
          fi

      - name: Run complete seventeen-system validation gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE/scripts/validate.ps1" `
            -GodotExecutable "$env:GITHUB_WORKSPACE/.godot-bin/godot"

      - name: Run real ENet graceful reconnect gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE/scripts/validate_multiplayer_loopback.ps1" `
            -GodotExecutable "$env:GITHUB_WORKSPACE/.godot-bin/godot" `
            -ProjectRoot "$env:GITHUB_WORKSPACE"

      - name: Commit and push only validated permanent files
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/expected-files.txt" <<'FILES'
          README.md
          addons/epochbound_arsenal_studio/plugin.gd
          addons/epochbound_audio_mood_studio/plugin.gd
          addons/epochbound_boss_studio/plugin.gd
          addons/epochbound_campaign_audit/plugin.gd
          addons/epochbound_campaign_studio/plugin.gd
          addons/epochbound_cinematic_studio/plugin.gd
          addons/epochbound_combat_director/plugin.gd
          addons/epochbound_companion_studio/plugin.gd
          addons/epochbound_editor_common/editor_plugin_icon.gd
          addons/epochbound_encounter_studio/plugin.gd
          addons/epochbound_item_forge/plugin.gd
          addons/epochbound_loadout_studio/plugin.gd
          addons/epochbound_package_studio/plugin.gd
          addons/epochbound_presentation_studio/plugin.gd
          addons/epochbound_save_state_studio/plugin.gd
          addons/epochbound_sprite_animation_studio/plugin.gd
          addons/epochbound_story_studio/plugin.gd
          addons/epochbound_trade_studio/plugin.gd
          docs/EDITOR_PLUGIN_RELIABILITY.md
          scripts/validate.ps1
          tools/check_release_workflow_policy.py
          tools/check_runtime_scene_contract.py
          tools/compile_probe.gd
          tools/smoke_editor_plugin_icons.gd
          FILES
          sort -o "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/expected-files.txt"
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > "${RUNNER_TEMP}/actual-files.txt"
          diff -u "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/actual-files.txt"
          git diff --check

          while IFS= read -r path; do
            git add -- "$path"
          done < "${RUNNER_TEMP}/expected-files.txt"
          git diff --cached --name-only | sort > "${RUNNER_TEMP}/staged-files.txt"
          diff -u "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/staged-files.txt"
          git diff --cached --check

          git config user.name "EVAVO Release Agent"
          git config user.email "evavo.studio@gmail.com"
          git commit -m "feat: harden editor plugin icon resolution [skip ci]"
          git diff --name-only HEAD^ HEAD | sort > "${RUNNER_TEMP}/committed-files.txt"
          diff -u "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/committed-files.txt"
          [[ -z "$(git status --porcelain=v1 --untracked-files=no)" ]]
          git push origin "HEAD:${TARGET_BRANCH}"
