name: Temporary Reference Warning-Free Validation

on:
  push:
    branches:
      - agent/reference-warning-free-release

permissions:
  contents: write

concurrency:
  group: epochbound-temp-reference-warning-free-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
      GODOT_BINARY: Godot_v4.6.2-stable_linux.x86_64
      GODOT_RELEASE_URL: https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable
      PATCH_SHA256: 2c8d0e8c41ee229788ba44eb637da7f92d93dc4240c9073fa6746a2dd555af4b
      TARGET_BRANCH: agent/reference-warning-free-release

    steps:
      - name: Check out exact branch candidate
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "${TARGET_BRANCH}" ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Decode and apply exact permanent patch
        shell: bash
        run: |
          set -euo pipefail
          patch_path="${RUNNER_TEMP}/reference-warning-free.patch"
          cat .evavo/reference-warning-free.patch.xz.b64.part* \
            | base64 --decode \
            | xz --decompress \
            > "${patch_path}"
          echo "${PATCH_SHA256}  ${patch_path}" | sha256sum --check --strict
          git apply --check "${patch_path}"
          git apply "${patch_path}"
          git diff --check

      - name: Run fail-closed source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_release_workflow_policy.py
          python3 tools/check_runtime_scene_contract.py
          python3 tools/check_player_settings_contract.py
          python3 tools/check_supply_region_contract.py
          python3 tools/check_canonical_journey_contract.py
          python3 tools/check_multiplayer_contract.py
          python3 tools/check_multiplayer_connection_contract.py
          python3 tools/check_multiplayer_loopback_contract.py
          python3 tools/check_sprite_animation_contract.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("campaigns").rglob("*.json")):
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
          print("all_campaign_json_parsed")
          PY

      - name: Download and verify Godot 4.6.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin .godot-download
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output .godot-download/SHA512-SUMS.txt \
            "${GODOT_RELEASE_URL}/SHA512-SUMS.txt"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output ".godot-download/${GODOT_ARCHIVE}" \
            "${GODOT_RELEASE_URL}/${GODOT_ARCHIVE}"
          grep -F "  ${GODOT_ARCHIVE}" .godot-download/SHA512-SUMS.txt \
            > .godot-download/selected-SHA512-SUMS.txt
          (cd .godot-download && sha512sum --check selected-SHA512-SUMS.txt)
          unzip -q ".godot-download/${GODOT_ARCHIVE}" -d .godot-bin
          mv ".godot-bin/${GODOT_BINARY}" .godot-bin/godot
          chmod +x .godot-bin/godot
          .godot-bin/godot --version | grep -E '^4\.6\.2'
          command -v pwsh >/dev/null || { echo "PowerShell is required" >&2; exit 1; }
          rm -rf .godot-download

      - name: Compile complete runtime and authoring surface
        shell: bash
        run: |
          set -euo pipefail
          .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" \
            --script res://tools/compile_probe.gd

      - name: Validate corrected cross-domain contracts
        shell: bash
        run: |
          set -euo pipefail
          .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" \
            --script res://tools/smoke_item_validation_edges.gd
          .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" \
            --script res://tools/smoke_cinematic_validation_edges.gd
          .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" \
            --script res://tools/smoke_campaign_audit_edges.gd

      - name: Prove warning-free reference content and audit
        shell: bash
        run: |
          set -euo pipefail
          content_log="${RUNNER_TEMP}/reference-content.log"
          audit_log="${RUNNER_TEMP}/reference-audit.log"
          .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" \
            --script res://tools/validate_content.gd 2>&1 | tee "${content_log}"
          grep -F "0 warning(s), 0 error(s)." "${content_log}"
          .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" \
            --script res://tools/audit_campaigns.gd 2>&1 | tee "${audit_log}"
          grep -F "Audit epochbound_demo: 0 blocker(s), 0 warning(s)." "${audit_log}"
          .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" \
            --script res://tools/smoke_campaign_audit.gd

      - name: Run complete seventeen-system validation gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE/scripts/validate.ps1" `
            -GodotExecutable "$env:GITHUB_WORKSPACE/.godot-bin/godot"

      - name: Run real ENet graceful reconnect gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE/scripts/validate_multiplayer_loopback.ps1" `
            -GodotExecutable "$env:GITHUB_WORKSPACE/.godot-bin/godot" `
            -ProjectRoot "$env:GITHUB_WORKSPACE"

      - name: Commit only permanent validated files
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/expected-files.txt" <<'FILES'
          .github/workflows/validate.yml
          README.md
          docs/CAMPAIGN_AUDIT_STUDIO.md
          docs/CAMPAIGN_FORMAT.md
          docs/CINEMATIC_TIMELINE_STUDIO.md
          docs/ITEM_FORGE.md
          scripts/validate.ps1
          src/content/campaign_audit.gd
          src/content/campaign_validator.gd
          src/content/cinematic_validator.gd
          src/content/item_validator.gd
          src/content/progression_source_index.gd
          tools/check_multiplayer_connection_contract.py
          tools/check_multiplayer_loopback_contract.py
          tools/check_release_workflow_policy.py
          tools/smoke_campaign_audit.gd
          tools/smoke_campaign_audit_edges.gd
          tools/smoke_cinematic_validation_edges.gd
          tools/smoke_item_validation_edges.gd
          FILES
          sort -o "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/expected-files.txt"
          git diff --name-only | sort > "${RUNNER_TEMP}/actual-files.txt"
          diff -u "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/actual-files.txt"
          git diff --check

          rm -f .evavo/reference-warning-free.patch.xz.b64.part*
          rm -f .github/workflows/temp-reference-warning-free-validation.yml
          git add -A
          git config user.name "EVAVO Release Agent"
          git config user.email "evavo.studio@gmail.com"
          git commit -m "feat: enforce warning-free reference release readiness"

          git fetch origin main
          git diff --name-only origin/main...HEAD | sort > "${RUNNER_TEMP}/final-files.txt"
          diff -u "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/final-files.txt"
          [[ -z "$(git status --porcelain=v1 --untracked-files=no)" ]]
          git push origin "HEAD:${TARGET_BRANCH}"
