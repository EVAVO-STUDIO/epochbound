name: Apply Save and State README updates

on:
  push:
    branches:
      - work/save-state-studio-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Document the seventh authoring tool
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/save-state-studio-foundation-20260729

      - name: Apply exact README transformations
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "19. Branching conversations with typed choices, conditions and effects\n20. Multi-stage quests driven by real inventory, map, era, world and encounter state\n21. Active-objective tracking and a keyboard/controller Journal\n22. Bidirectional travel between Bellweather Crossing and Clockwood Edge\n23. Pause, resume and safe transition flow",
                  "19. Branching conversations with typed choices, conditions and effects\n20. Multi-stage quests driven by real inventory, map, era, world and encounter state\n21. Active-objective tracking and a keyboard/controller Journal\n22. Versioned save profiles with deterministic checksums, migrations and backup recovery\n23. Continue, autosave and three campaign-authored manual save slots\n24. Exact durable restoration across maps, eras, inventory, quests and world outcomes\n25. Bidirectional travel between Bellweather Crossing and Clockwood Edge\n26. Pause, resume and safe transition flow"
              ),
              (
                  "These placeholders establish composition, scale, timing, camera, traversal, encounter, companion, inventory, story and interaction contracts",
                  "These placeholders establish composition, scale, timing, camera, traversal, encounter, companion, inventory, story, save-state and interaction contracts"
              ),
              (
                  "- **Quiet the Ash Hunt** begins in Ashen dialogue and completes from Combat Director’s stable `east_ash_hunt` clear-state key.\n\n## Content locations",
                  "- **Quiet the Ash Hunt** begins in Ashen dialogue and completes from Combat Director’s stable `east_ash_hunt` clear-state key.\n\n## Save & State Studio\n\nThe **State** main-screen editor inspects and manages versioned player profiles without writing them into campaign source. It can:\n\n- discover autosave and manual slots for each campaign;\n- show schema, checksum, timestamp, reason, map, era and play time;\n- inspect persisted inventory, learned recipes, quest stages and durable world-state keys;\n- validate a profile against the currently installed campaign definitions;\n- rewrite supported legacy profiles through explicit migrations;\n- recover a previous complete checkpoint from a rotated backup;\n- delete a slot together with its backup and abandoned temporary file;\n- expose canonical read-only JSON for support and review.\n\nThe runtime adds a title-screen **Continue** flow, one managed autosave slot and campaign-authored manual slots. Writes use temporary files and promotion rather than overwriting the only valid copy. Map, era, positions, health, inventory, recipes, discoveries, defeated enemies, cleared encounters, quest progress, clock shards, companion hold state and play time restore from one validated profile. Transient dialogue, attack windups, knockback and menu state reset safely.\n\nThe reference campaign exposes three manual slots, autosaves after safe travel or meaningful durable progress, and blocks manual saving during active directed combat.\n\n## Content locations"
              ),
              (
                  "- [`docs/STORY_STUDIO.md`](docs/STORY_STUDIO.md) for conversation graphs, typed conditions, quest stages, rewards and story-quality gates;\n- [`docs/OBJECT_FORMAT.md`](docs/OBJECT_FORMAT.md)",
                  "- [`docs/STORY_STUDIO.md`](docs/STORY_STUDIO.md) for conversation graphs, typed conditions, quest stages, rewards and story-quality gates;\n- [`docs/SAVE_STATE_STUDIO.md`](docs/SAVE_STATE_STUDIO.md) for save profiles, migration, backup recovery and durable-state quality gates;\n- [`docs/OBJECT_FORMAT.md`](docs/OBJECT_FORMAT.md)"
              ),
              (
                  "| Open or close Journal | J | Right stick click |\n| Back, pause or skip | Escape | Start |",
                  "| Open or close Journal | J | Right stick click |\n| Open or close Save Profiles | K | Left stick click |\n| Back, pause or skip | Escape | Start |"
              ),
              (
                  "Inside the Journal, use Left and Right to change Active or Completed tabs and Up or Down to select a quest.",
                  "Inside the Journal, use Left and Right to change Active or Completed tabs and Up or Down to select a quest.\n\nInside Save Profiles, use Left and Right to change Save or Load mode, Up and Down to select a slot, and E, Z, Space or C to confirm. Autosave is managed by the campaign and cannot be overwritten manually."
              ),
              (
                  "1. direct loading and compilation of the runtime, critical resources and all six editor plugins;\n2. headless project import with logged parser and plugin errors treated as failures;\n3. complete campaign, map, object, placement, encounter-zone, companion, item, recipe, conversation and quest validation;",
                  "1. direct loading and compilation of the runtime, critical resources and all seven editor plugins;\n2. headless project import with logged parser and plugin errors treated as failures;\n3. complete campaign, map, object, placement, encounter-zone, companion, item, recipe, conversation, quest and save-policy validation;"
              ),
              (
                  "10. executable Story Studio graph and editor-state smoke tests;\n11. malformed conversation, condition, effect and quest-stage rejection tests.",
                  "10. executable Story Studio graph and editor-state smoke tests;\n11. malformed conversation, condition, effect and quest-stage rejection tests;\n12. deterministic save capture, checksum, atomic write and exact runtime-restoration tests;\n13. legacy migration, future-schema rejection, corruption detection and backup-recovery tests;\n14. executable Save & State Studio slot and inspector tests."
              ),
              (
                  "- Conversations and quests that consume the same world, item, encounter and companion outcomes instead of parallel state",
                  "- Conversations and quests that consume the same world, item, encounter and companion outcomes instead of parallel state\n- Save profiles that serialise those same stable IDs and durable outcomes instead of the live scene tree"
              ),
              (
                  "- [`docs/STORY_STUDIO.md`](docs/STORY_STUDIO.md): branching dialogue and quest production rules\n- [`docs/OBJECT_FORMAT.md`](docs/OBJECT_FORMAT.md)",
                  "- [`docs/STORY_STUDIO.md`](docs/STORY_STUDIO.md): branching dialogue and quest production rules\n- [`docs/SAVE_STATE_STUDIO.md`](docs/SAVE_STATE_STUDIO.md): save profile, migration and durable-state production rules\n- [`docs/OBJECT_FORMAT.md`](docs/OBJECT_FORMAT.md)"
              ),
              (
                  "The next vertical slices will build on the current contracts rather than replace them: deterministic world-state inspection, durable save profiles and migrations, equipment and capability gates, merchants, ranged attacks, bosses, cinematics, campaign packaging, localisation, and automated quest-reachability, economy, companion-recovery, damage and softlock probes.",
                  "The next vertical slices will build on the current contracts rather than replace them: equipment and capability gates, merchants and economy, ranged attacks, bosses, cinematics, campaign packaging and import/export, localisation, cloud-save integration, and automated quest-reachability, save-compatibility, companion-recovery, damage and softlock probes."
              )
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one reviewed README occurrence, found {count}: {old[:100]!r}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8", newline="\n")
          Path(".github/workflows/apply-save-state-readme.yml").unlink()

      - name: Commit README updates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/apply-save-state-readme.yml
          git commit -m "docs: document Save and State Studio"
          git push origin HEAD:work/save-state-studio-foundation-20260729
