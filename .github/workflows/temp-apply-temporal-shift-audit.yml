name: Temporary Apply Temporal Shift Audit

on:
  push:
    branches:
      - agent/temporal-shift-audit

permissions:
  contents: write

concurrency:
  group: epochbound-temp-apply-temporal-shift-audit
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic integration edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/temp_apply_temporal_shift_integration.py")
          source = path.read_text(encoding="utf-8")
          function_anchor = '''    file_path.write_text(source.replace(old, new, 1), encoding="utf-8")


replace_once('''
          replacement = '''    file_path.write_text(source.replace(old, new, 1), encoding="utf-8")


def replace_first(path: str, old: str, new: str) -> None:
    file_path = Path(path)
    source = file_path.read_text(encoding="utf-8")
    if old not in source:
        raise SystemExit(f"{path}: missing first-match replacement anchor: {old[:100]!r}")
    file_path.write_text(source.replace(old, new, 1), encoding="utf-8")


replace_once('''
          if source.count(function_anchor) != 1:
              raise SystemExit("temporary applicator function anchor drifted")
          source = source.replace(function_anchor, replacement, 1)
          call_anchor = '\nreplace_once(\n    "tools/check_release_workflow_policy.py",'
          if source.count(call_anchor) < 1:
              raise SystemExit("temporary applicator workflow-policy call anchor drifted")
          source = source.replace(
              call_anchor,
              '\nreplace_first(\n    "tools/check_release_workflow_policy.py",',
              1,
          )
          exec(compile(source, str(path), "exec"), {"__name__": "__main__"})
          PY

      - name: Verify and publish exact non-workflow edits
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/*.py
          rm -rf tools/__pycache__
          git diff --check
          cat > "${RUNNER_TEMP}/expected-files.txt" <<'FILES'
          README.md
          addons/epochbound_campaign_audit/campaign_audit_studio.gd
          docs/AUDIT_PLAYTEST_CHECKLIST.md
          docs/CAMPAIGN_AUDIT_STUDIO.md
          scripts/validate.ps1
          src/content/campaign_audit.gd
          tools/check_release_workflow_policy.py
          tools/compile_probe.gd
          tools/smoke_campaign_audit.gd
          tools/smoke_campaign_audit_edges.gd
          tools/smoke_campaign_audit_studio.gd
          FILES
          sort -o "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/expected-files.txt"
          git diff --name-only | sort > "${RUNNER_TEMP}/actual-files.txt"
          diff -u "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/actual-files.txt"
          git add --pathspec-from-file="${RUNNER_TEMP}/expected-files.txt"
          git diff --cached --check
          git config user.name "EVAVO Release Agent"
          git config user.email "evavo.studio@gmail.com"
          git commit -m "feat: audit meaningful temporal shift consequences [skip ci]"
          git push origin HEAD:agent/temporal-shift-audit
