name: Apply Combat Director UI signal fix

on:
  push:
    branches:
      - work/combat-director-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Patch inherited signal connection
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/combat-director-foundation-20260729

      - name: Apply exact signal fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("addons/epochbound_combat_director/combat_director_studio.gd")
          source = path.read_text(encoding="utf-8")
          old = '\tcanvas.canvas_clicked.connect(on_canvas_clicked)\n'
          new = '\tcanvas.connect("canvas_clicked", Callable(self, "on_canvas_clicked"))\n'
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one inherited canvas signal connection.")
          path.write_text(source.replace(old, new), encoding="utf-8", newline="\n")
          Path(".github/workflows/apply-combat-director-ui-fix.yml").unlink()

      - name: Commit targeted UI fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons/epochbound_combat_director/combat_director_studio.gd .github/workflows/apply-combat-director-ui-fix.yml
          git commit -m "fix: connect inherited Combat Director canvas signal"
          git push origin HEAD:work/combat-director-foundation-20260729
