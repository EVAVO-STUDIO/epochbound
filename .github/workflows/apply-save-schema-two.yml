name: Apply save schema two

on:
  push:
    branches:
      - work/loadout-capability-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Add equipment-aware save migration
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/loadout-capability-foundation-20260729

      - name: Upgrade save profile contract
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/content/save_profile.gd")
          source = path.read_text(encoding="utf-8")
          source = source.replace("const CURRENT_SCHEMA := 1", "const CURRENT_SCHEMA := 2", 1)

          pattern = re.compile(
              r"static func migrate\(raw_profile: Dictionary\) -> Dictionary:\n.*?\n\nstatic func refresh_checksum",
              re.S,
          )
          replacement = '''static func migrate(raw_profile: Dictionary) -> Dictionary:
          \tvar version := int(raw_profile.get("schema_version", 0))
          \tif version == CURRENT_SCHEMA:
          \t\treturn {
          \t\t\t"ok": true,
          \t\t\t"profile": raw_profile.duplicate(true),
          \t\t\t"migrated": false,
          \t\t\t"from_version": CURRENT_SCHEMA,
          \t\t\t"errors": []
          \t\t}
          \tif version > CURRENT_SCHEMA:
          \t\treturn {
          \t\t\t"ok": false,
          \t\t\t"profile": {},
          \t\t\t"migrated": false,
          \t\t\t"from_version": version,
          \t\t\t"errors": ["Save profile schema %d is newer than supported schema %d." % [version, CURRENT_SCHEMA]]
          \t\t}
          \tif version < 0:
          \t\treturn {
          \t\t\t"ok": false,
          \t\t\t"profile": {},
          \t\t\t"migrated": false,
          \t\t\t"from_version": version,
          \t\t\t"errors": ["Save profile schema_version cannot be negative."]
          \t\t}

          \tif version == 1:
          \t\tif not checksum_valid(raw_profile):
          \t\t\treturn {
          \t\t\t\t"ok": false,
          \t\t\t\t"profile": {},
          \t\t\t\t"migrated": false,
          \t\t\t\t"from_version": version,
          \t\t\t\t"errors": ["Legacy schema 1 checksum is missing or invalid."]
          \t\t\t}
          \t\tvar metadata := dictionary_or_empty(raw_profile.get("metadata", {}))
          \t\tvar payload := dictionary_or_empty(raw_profile.get("payload", {}))
          \t\tpayload["equipment"] = dictionary_or_empty(payload.get("equipment", {}))
          \t\tvar migrated_profile := build_profile(
          \t\t\tstr(raw_profile.get("campaign_id", "")),
          \t\t\tstr(raw_profile.get("slot_id", "slot_1")),
          \t\t\tmetadata,
          \t\t\tpayload
          \t\t)
          \t\treturn {
          \t\t\t"ok": true,
          \t\t\t"profile": migrated_profile,
          \t\t\t"migrated": true,
          \t\t\t"from_version": version,
          \t\t\t"errors": []
          \t\t}

          \t# Legacy schema 0 stored durable state directly on the root object.
          \tvar campaign_id := str(raw_profile.get("campaign_id", "")).strip_edges()
          \tvar slot_id := str(raw_profile.get("slot_id", raw_profile.get("slot", "slot_1"))).strip_edges()
          \tvar legacy_metadata_value: Variant = raw_profile.get("metadata", {})
          \tvar metadata: Dictionary = legacy_metadata_value.duplicate(true) if typeof(legacy_metadata_value) == TYPE_DICTIONARY else {}
          \tmetadata["saved_at_unix"] = int(metadata.get("saved_at_unix", raw_profile.get("saved_at_unix", 0)))
          \tmetadata["play_time_seconds"] = float(metadata.get("play_time_seconds", raw_profile.get("play_time_seconds", 0.0)))
          \tmetadata["reason"] = str(metadata.get("reason", "Migrated legacy save"))
          \tmetadata["map_id"] = str(metadata.get("map_id", raw_profile.get("map_id", raw_profile.get("map", ""))))
          \tmetadata["era_id"] = str(metadata.get("era_id", raw_profile.get("era_id", raw_profile.get("era", ""))))

          \tvar legacy_payload_value: Variant = raw_profile.get("payload", {})
          \tvar payload: Dictionary = legacy_payload_value.duplicate(true) if typeof(legacy_payload_value) == TYPE_DICTIONARY else {}
          \tif payload.is_empty():
          \t\tpayload = {
          \t\t\t"map_id": str(raw_profile.get("map_id", raw_profile.get("map", ""))),
          \t\t\t"era_id": str(raw_profile.get("era_id", raw_profile.get("era", ""))),
          \t\t\t"player_position": normalise_position(raw_profile.get("player_position", raw_profile.get("player", {}))),
          \t\t\t"companion_position": normalise_position(raw_profile.get("companion_position", raw_profile.get("companion", {}))),
          \t\t\t"facing": normalise_position(raw_profile.get("facing", {"x": 0, "y": 1})),
          \t\t\t"player_health": int(raw_profile.get("player_health", raw_profile.get("health", 1))),
          \t\t\t"companion_health": int(raw_profile.get("companion_health", 1)),
          \t\t\t"clock_shards": int(raw_profile.get("clock_shards", 0)),
          \t\t\t"inventory": dictionary_or_empty(raw_profile.get("inventory", {})),
          \t\t\t"unlocked_recipes": string_array(raw_profile.get("unlocked_recipes", raw_profile.get("recipes", []))),
          \t\t\t"session_state": dictionary_or_empty(raw_profile.get("session_state", raw_profile.get("state", {}))),
          \t\t\t"quest_progress": dictionary_or_empty(raw_profile.get("quest_progress", raw_profile.get("quests", {}))),
          \t\t\t"equipment": dictionary_or_empty(raw_profile.get("equipment", {})),
          \t\t\t"companion_command": "follow",
          \t\t\t"companion_hold_position": normalise_position(raw_profile.get("companion_position", raw_profile.get("companion", {})))
          \t\t}
          \telse:
          \t\tpayload["equipment"] = dictionary_or_empty(payload.get("equipment", {}))
          \tvar migrated := build_profile(campaign_id, slot_id, metadata, payload)
          \treturn {
          \t\t"ok": true,
          \t\t"profile": migrated,
          \t\t"migrated": true,
          \t\t"from_version": version,
          \t\t"errors": []
          \t}


          static func refresh_checksum'''
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"Expected one migrate function block, replaced {count}.")

          old_fields = 'for field in ["inventory", "session_state", "quest_progress"]:'
          new_fields = 'for field in ["inventory", "session_state", "quest_progress", "equipment"]:'
          if source.count(old_fields) != 1:
              raise SystemExit("Expected one durable dictionary field loop.")
          source = source.replace(old_fields, new_fields, 1)

          old_summary = '''\tvar quests_value: Variant = payload.get("quest_progress", {})
          \tvar quests: Dictionary = quests_value if typeof(quests_value) == TYPE_DICTIONARY else {}
          \tvar active_quests := 0
          '''
          new_summary = '''\tvar quests_value: Variant = payload.get("quest_progress", {})
          \tvar quests: Dictionary = quests_value if typeof(quests_value) == TYPE_DICTIONARY else {}
          \tvar equipment_value: Variant = payload.get("equipment", {})
          \tvar equipment: Dictionary = equipment_value if typeof(equipment_value) == TYPE_DICTIONARY else {}
          \tvar active_quests := 0
          '''
          if source.count(old_summary) != 1:
              raise SystemExit("Expected one profile summary setup block.")
          source = source.replace(old_summary, new_summary, 1)

          old_return = '''\t\t"inventory_stacks": inventory.size(),
          \t\t"active_quests": active_quests,
          '''
          new_return = '''\t\t"inventory_stacks": inventory.size(),
          \t\t"equipment_slots": equipment.size(),
          \t\t"active_quests": active_quests,
          '''
          if source.count(old_return) != 1:
              raise SystemExit("Expected one profile summary return block.")
          source = source.replace(old_return, new_return, 1)

          path.write_text(source, encoding="utf-8", newline="\n")
          Path(".github/workflows/apply-save-schema-two.yml").unlink()

      - name: Commit schema migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/save_profile.gd .github/workflows/apply-save-schema-two.yml
          git commit -m "feat: migrate durable profiles to equipment schema"
          git push origin HEAD:work/loadout-capability-foundation-20260729
