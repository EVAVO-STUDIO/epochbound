name: Apply save runtime compatibility updates

on:
  push:
    branches:
      - work/save-state-studio-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Patch inherited runtime checks and campaign defaults
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/save-state-studio-foundation-20260729

      - name: Apply exact source transformations
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "tools/smoke_combat_director.gd": [
                  (
                      'runtime_path in ["res://src/combat_director_runtime.gd", "res://src/companion_runtime.gd", "res://src/inventory_runtime.gd", "res://src/story_runtime.gd"],',
                      'runtime_path in ["res://src/combat_director_runtime.gd", "res://src/companion_runtime.gd", "res://src/inventory_runtime.gd", "res://src/story_runtime.gd", "res://src/save_runtime.gd"],'
                  )
              ],
              "tools/smoke_companion_director.gd": [
                  (
                      'str((script_value as GDScript).resource_path) in ["res://src/companion_runtime.gd", "res://src/inventory_runtime.gd", "res://src/story_runtime.gd"],',
                      'str((script_value as GDScript).resource_path) in ["res://src/companion_runtime.gd", "res://src/inventory_runtime.gd", "res://src/story_runtime.gd", "res://src/save_runtime.gd"],'
                  )
              ],
              "tools/smoke_item_forge.gd": [
                  (
                      'str((script_value as GDScript).resource_path) in ["res://src/inventory_runtime.gd", "res://src/story_runtime.gd"],',
                      'str((script_value as GDScript).resource_path) in ["res://src/inventory_runtime.gd", "res://src/story_runtime.gd", "res://src/save_runtime.gd"],'
                  )
              ],
              "tools/smoke_story_studio.gd": [
                  (
                      'str((script_value as GDScript).resource_path) == "res://src/story_runtime.gd",\n\t\t\t"Runtime scene must bind the Story runtime."',
                      'str((script_value as GDScript).resource_path) in ["res://src/story_runtime.gd", "res://src/save_runtime.gd"],\n\t\t\t"Runtime scene must bind a story-capable runtime."'
                  )
              ],
              "src/content/campaign_repository.gd": [
                  (
                      '\t\t"story_files": ["story/core.json"],\n\t\t"starting_inventory": [',
                      '\t\t"story_files": ["story/core.json"],\n\t\t"save_policy": {\n\t\t\t"manual_slots": 3,\n\t\t\t"autosave_enabled": true,\n\t\t\t"autosave_on_travel": true,\n\t\t\t"autosave_on_progress": true,\n\t\t\t"allow_manual_save_in_combat": false\n\t\t},\n\t\t"starting_inventory": ['
                  )
              ]
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              source = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = source.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected one occurrence, found {count}: {old!r}")
                  source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8", newline="\n")

          Path(".github/workflows/apply-save-runtime-compat.yml").unlink()

      - name: Commit compatibility updates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/smoke_combat_director.gd tools/smoke_companion_director.gd tools/smoke_item_forge.gd tools/smoke_story_studio.gd src/content/campaign_repository.gd .github/workflows/apply-save-runtime-compat.yml
          git commit -m "test: align inherited systems with save runtime"
          git push origin HEAD:work/save-state-studio-foundation-20260729
