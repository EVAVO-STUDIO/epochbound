name: Cleanup merged branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-merged-branches.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: Audit and delete merged non-main branches
    runs-on: ubuntu-latest

    steps:
      - name: Check out main with all refs
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Audit every non-main branch before deletion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          mapfile -t branches < <(
            git for-each-ref refs/remotes/origin \
              --format='%(refname:strip=3)' \
              | grep -vE '^(HEAD|main)$' \
              | sort -u
          )

          printf '%s\n' "${branches[@]}" > /tmp/epochbound-branches.txt

          if [ "${#branches[@]}" -eq 0 ]; then
            echo "No non-main branches remain."
            exit 0
          fi

          for branch in "${branches[@]}"; do
            if [ "$branch" = "noop-verification-should-not-persist" ]; then
              if ! git merge-base --is-ancestor "origin/$branch" origin/main; then
                echo "Refusing cleanup: $branch contains work not present in main."
                exit 1
              fi
              echo "Audited temporary verification branch: $branch"
              continue
            fi

            merged_count="$(
              gh pr list \
                --repo "$GITHUB_REPOSITORY" \
                --state merged \
                --head "$branch" \
                --limit 1 \
                --json number \
                --jq 'length'
            )"

            if [ "$merged_count" -lt 1 ]; then
              echo "Refusing cleanup: branch '$branch' has no merged pull request."
              exit 1
            fi

            echo "Audited merged branch: $branch"
          done

      - name: Delete audited branches
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/epochbound-branches.txt ]; then
            echo "Nothing to delete."
            exit 0
          fi

          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            git push origin --delete "$branch"
          done < /tmp/epochbound-branches.txt

      - name: Remove this one-time workflow from main
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cleanup-merged-branches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/cleanup-merged-branches.yml
          git commit -m "chore: remove completed branch cleanup workflow"
          git push origin HEAD:main
