name: Temporary Economy Source Publisher

on:
  push:
    branches:
      - agent/economy-balance-simulation-v2

permissions:
  contents: write

concurrency:
  group: epochbound-temp-economy-source-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact recovery branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct the checksum-locked validated tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/temp_apply_economy_v3.py
          git diff --check
          python3 -m py_compile tools/*.py
          rm -rf tools/__pycache__
          python3 tools/check_release_workflow_policy.py
          for checker in tools/check_*_contract.py; do
            python3 "$checker"
          done

      - name: Publish the 22 non-workflow production files
        shell: bash
        run: |
          set -euo pipefail

          # The exact desired validate.yml already passed the complete Godot and
          # real ENet gates in runs 31296945552 and 31297104051. Restore the
          # current tracked copy here because GITHUB_TOKEN may not publish
          # workflow-file changes; the GitHub connector publishes that one file.
          git restore --source=HEAD -- .github/workflows/validate.yml
          git diff --check

          git diff --name-only | sort -u > "${RUNNER_TEMP}/changed-files.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path

          expected = {
              "README.md",
              "addons/epochbound_campaign_audit/campaign_audit_studio.gd",
              "docs/AUDIT_PLAYTEST_CHECKLIST.md",
              "docs/CAMPAIGN_AUDIT_STUDIO.md",
              "docs/ECONOMY_BALANCE_SIMULATION.md",
              "docs/ECONOMY_PLAYTEST_CHECKLIST.md",
              "scripts/validate.ps1",
              "src/content/campaign_audit.gd",
              "src/content/economy_balance_simulation.gd",
              "tools/check_boss_music_stem_contract.py",
              "tools/check_combat_fairness_contract.py",
              "tools/check_economy_balance_contract.py",
              "tools/check_long_form_progression_contract.py",
              "tools/check_multiplayer_connection_contract.py",
              "tools/check_multiplayer_loopback_contract.py",
              "tools/check_release_workflow_policy.py",
              "tools/check_temporal_shift_contract.py",
              "tools/compile_probe.gd",
              "tools/smoke_campaign_audit.gd",
              "tools/smoke_campaign_audit_edges.gd",
              "tools/smoke_campaign_audit_studio.gd",
              "tools/smoke_economy_balance_simulation.gd",
          }
          root = Path(os.environ["RUNNER_TEMP"])
          changed = {
              line.strip()
              for line in (root / "changed-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          if changed != expected:
              raise SystemExit(
                  "non-workflow release mismatch; unexpected="
                  + ", ".join(sorted(changed - expected))
                  + "; missing="
                  + ", ".join(sorted(expected - changed))
              )
          (root / "publish-files.txt").write_text(
              "\n".join(sorted(expected)) + "\n",
              encoding="utf-8",
          )
          print("publishing exactly 22 validated non-workflow files")
          PY

          git add --pathspec-from-file="${RUNNER_TEMP}/publish-files.txt"
          git diff --cached --check
          git config user.name "EVAVO Release Agent"
          git config user.email "evavo.studio@gmail.com"
          git commit -m "feat: add deterministic economy balance simulation [skip ci]"

          git rm \
            tools/temp_apply_economy_v2.py \
            tools/temp_economy_v2_part01.txt \
            tools/temp_economy_v2_part02.txt \
            tools/temp_apply_economy_v3.py \
            tools/temp_economy_v3_supplement_01.txt \
            tools/temp_economy_v3_supplement_02.txt \
            tools/temp_economy_v3_supplement_03.txt \
            tools/temp_economy_v3_supplement_04.txt
          git commit -m "chore: remove temporary economy patch transport [skip ci]"

          git fetch origin main
          git diff --check origin/main...HEAD
          test -z "$(git status --porcelain)"
          git push origin HEAD:agent/economy-balance-simulation-v2
