name: Temporary Boss Music Stem Integration

on:
  push:
    branches:
      - agent/boss-phase-music-stems

permissions:
  contents: write

concurrency:
  group: epochbound-temp-boss-music-stems
  cancel-in-progress: false

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
      GODOT_BINARY: Godot_v4.6.2-stable_linux.x86_64
      GODOT_RELEASE_URL: https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable

    steps:
      - name: Check out exact branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic boss music stem integration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/temp_fix_boss_music_applicator.py
          python3 tools/temp_apply_boss_music_stems.py
          python3 tools/temp_fix_boss_music_smoke.py
          git diff --check

      - name: Run all fail-closed source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/*.py
          rm -rf tools/__pycache__
          python3 tools/check_release_workflow_policy.py
          for checker in tools/check_*_contract.py; do
            python3 "$checker"
          done

      - name: Download and verify official Godot 4.6.2 editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin .godot-download
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output .godot-download/SHA512-SUMS.txt \
            "${GODOT_RELEASE_URL}/SHA512-SUMS.txt"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output ".godot-download/${GODOT_ARCHIVE}" \
            "${GODOT_RELEASE_URL}/${GODOT_ARCHIVE}"
          grep -F "  ${GODOT_ARCHIVE}" .godot-download/SHA512-SUMS.txt \
            > .godot-download/selected-SHA512-SUMS.txt
          (cd .godot-download && sha512sum --check selected-SHA512-SUMS.txt)
          unzip -q ".godot-download/${GODOT_ARCHIVE}" -d .godot-bin
          mv ".godot-bin/${GODOT_BINARY}" .godot-bin/godot
          chmod +x .godot-bin/godot
          version="$(.godot-bin/godot --version)"
          [[ "${version}" =~ ^4\.6\.2 ]] || { echo "Unexpected Godot version: ${version}" >&2; exit 1; }
          command -v pwsh >/dev/null || { echo "PowerShell is required" >&2; exit 1; }
          rm -rf .godot-download

      - name: Run complete leak-free seventeen-system validation gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE/scripts/validate.ps1" `
            -GodotExecutable "$env:GITHUB_WORKSPACE/.godot-bin/godot"

      - name: Run real ENet graceful reconnect gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE/scripts/validate_multiplayer_loopback.ps1" `
            -GodotExecutable "$env:GITHUB_WORKSPACE/.godot-bin/godot" `
            -ProjectRoot "$env:GITHUB_WORKSPACE"

      - name: Verify and publish permanent non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only \
            | grep -v '^tools/temp_' \
            > "${RUNNER_TEMP}/changed-files.txt"
          grep -v '^\.github/workflows/' "${RUNNER_TEMP}/changed-files.txt" \
            > "${RUNNER_TEMP}/publish-files.txt"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          allowed_exact = {
              ".github/workflows/audio-mood-validation.yml",
              ".github/workflows/validate.yml",
              "README.md",
              "addons/epochbound_audio_mood_studio/audio_mood_studio.gd",
              "campaigns/epochbound_demo/audio/core.json",
              "docs/AUDIO_MOOD_STUDIO.md",
              "scripts/validate.ps1",
              "src/audio_mood_controller.gd",
              "src/audio_mood_runtime.gd",
              "src/content/audio_mood_catalog.gd",
              "src/content/audio_mood_strict_validator.gd",
              "src/content/audio_mood_validator.gd",
              "tools/compile_probe.gd",
              "tools/check_release_workflow_policy.py",
              "tools/smoke_audio_mood_studio.gd",
              "tools/smoke_audio_mood_validation_edges.gd",
              "tools/smoke_boss_music_stems.gd",
          }
          root = Path(os.environ["RUNNER_TEMP"])
          changed = [
              line.strip()
              for line in (root / "changed-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          publish = [
              line.strip()
              for line in (root / "publish-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if not changed or not publish:
              raise SystemExit("boss music stem applicator produced no publishable changes")
          for workflow in (
              ".github/workflows/audio-mood-validation.yml",
              ".github/workflows/validate.yml",
          ):
              if workflow not in changed:
                  raise SystemExit(f"validated workflow update is missing: {workflow}")
          unexpected = [
              path
              for path in changed
              if path not in allowed_exact
              and re.fullmatch(r"tools/check_[a-z0-9_]+_contract\.py", path) is None
          ]
          if unexpected:
              raise SystemExit("unexpected changed files: " + ", ".join(unexpected))
          print("validated permanent changes:")
          for path in changed:
              print(f"- {path}")
          print("publishing non-workflow source through Actions:")
          for path in publish:
              print(f"- {path}")
          print("publishing protected workflows separately through the GitHub connector")
          PY
          git add --pathspec-from-file="${RUNNER_TEMP}/publish-files.txt"
          git diff --cached --check
          git config user.name "EVAVO Release Agent"
          git config user.email "evavo.studio@gmail.com"
          git commit -m "feat: add authored boss phase music stems [skip ci]"
          git push origin HEAD:agent/boss-phase-music-stems
