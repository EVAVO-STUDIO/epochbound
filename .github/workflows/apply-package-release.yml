name: Apply Package and Release Studio
# Registered direct-main trigger.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-package-release.yml

permissions:
  contents: write

concurrency:
  group: epochbound-package-release-main
  cancel-in-progress: false

jobs:
  apply:
    name: Commit Package and Release Studio to main
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply source-controlled implementation
        shell: python
        run: |
          import base64
          import zlib
          from pathlib import Path

          chunk_root = Path('.github/package-release')
          payload = ''.join(
              path.read_text(encoding='utf-8').strip()
              for path in sorted(chunk_root.glob('part-*'))
          )
          source = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          exec(compile(source, 'apply_package_release.py', 'exec'))

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/package-release
          rm -f .github/workflows/apply-package-release.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build Package and Release Studio"
          git push origin HEAD:main
