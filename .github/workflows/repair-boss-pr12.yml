name: Repair Boss PR 12
# Final arena-release patch.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-boss-pr12.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Boss branch
        uses: actions/checkout@v4
        with:
          ref: work/boss-phase-foundation-20260730
          fetch-depth: 0

      - name: Release transient arena state after durable completion
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/boss_runtime.gd")
          text = path.read_text(encoding="utf-8")

          constants_old = '''const BOSS_BANNER_DURATION := 1.8
          const BOSS_ARENA_LINE_WIDTH := 2.0
          '''
          constants_new = '''const BOSS_BANNER_DURATION := 1.8
          const BOSS_ARENA_LINE_WIDTH := 2.0
          const BOSS_ARENA_LOCK_MESSAGE := "The arena remains sealed while the guardian's pattern is active."
          '''
          if "BOSS_ARENA_LOCK_MESSAGE" not in text:
              if constants_old not in text:
                  raise SystemExit("Boss constant marker missing")
              text = text.replace(constants_old, constants_new, 1)

          text = text.replace(
              'dialogue = "The arena remains sealed while the guardian\'s pattern is active."',
              'dialogue = BOSS_ARENA_LOCK_MESSAGE',
          )

          completion_old = '''			show_boss_banner(message)
          		engaged_bosses.erase(placement_id)
          '''
          completion_new = '''			show_boss_banner(message)
          		release_boss_arena_transients()
          		engaged_bosses.erase(placement_id)
          '''
          if "release_boss_arena_transients()" not in text:
              if completion_old not in text:
                  raise SystemExit("Boss completion marker missing")
              text = text.replace(completion_old, completion_new, 1)

          helper = '''

          func release_boss_arena_transients() -> void:
          	projectiles.clear()
          	cancel_reload(false)
          	transition_lock = 0.0
          	if dialogue == BOSS_ARENA_LOCK_MESSAGE:
          		dialogue = ""
          '''
          anchor = '\n\nfunc move_actor(actor_id: String, desired_position: Vector2) -> void:\n'
          if "func release_boss_arena_transients()" not in text:
              if anchor not in text:
                  raise SystemExit("Boss helper insertion point missing")
              text = text.replace(anchor, helper + anchor, 1)

          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Commit Boss runtime repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/boss_runtime.gd
          if git diff --cached --quiet; then
            echo "Boss arena release already repaired."
            exit 0
          fi
          git commit -m "fix: release Boss arena state after completion"
          git push origin HEAD:work/boss-phase-foundation-20260730
