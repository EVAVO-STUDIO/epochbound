name: Apply reference combat zone data

on:
  push:
    branches:
      - work/combat-director-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Author and format reference encounter zones
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/combat-director-foundation-20260729

      - name: Add reference encounter zones
        shell: python
        run: |
          import json
          from pathlib import Path

          records = {
              "campaigns/epochbound_demo/maps/bellweather_crossing.json": [
                  {
                      "id": "east_ash_hunt",
                      "display_name": "East Ash Hunt",
                      "position": {"x": 416, "y": 216},
                      "radius": 96,
                      "activation_radius": 148,
                      "leash_padding": 32,
                      "enemy_placements": ["crossing_hound"],
                      "available_eras": ["ashen"],
                      "clear_state_key": "bellweather:zone:east_ash_hunt"
                  }
              ],
              "campaigns/epochbound_demo/maps/clockwood_edge.json": [
                  {
                      "id": "clockwood_hound_pair",
                      "display_name": "Clockwood Hound Pair",
                      "position": {"x": 400, "y": 240},
                      "radius": 132,
                      "activation_radius": 188,
                      "leash_padding": 42,
                      "enemy_placements": ["clockwood_hound_west", "clockwood_hound_east"],
                      "available_eras": ["ashen"],
                      "clear_state_key": "clockwood:zone:hound_pair"
                  }
              ]
          }

          for filename, zones in records.items():
              path = Path(filename)
              data = json.loads(path.read_text(encoding="utf-8"))
              data["encounter_zones"] = zones
              path.write_text(json.dumps(data, indent="\t", ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")

          Path(".github/workflows/apply-combat-zone-data.yml").unlink()

      - name: Commit authored zone data
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campaigns/epochbound_demo/maps/bellweather_crossing.json campaigns/epochbound_demo/maps/clockwood_edge.json .github/workflows/apply-combat-zone-data.yml
          git commit -m "feat: author reference encounter zones"
          git push origin HEAD:work/combat-director-foundation-20260729
