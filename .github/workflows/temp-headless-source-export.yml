name: Temporary Audio Teardown Probe

on:
  push:
    branches:
      - agent/headless-cleanup

permissions:
  contents: read

concurrency:
  group: epochbound-temp-headless-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
      GODOT_BINARY: Godot_v4.6.2-stable_linux.x86_64
      GODOT_RELEASE_URL: https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm exact clean source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Apply explicit audio teardown experiment
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/audio_mood_controller.gd")
          source = path.read_text(encoding="utf-8")
          source += '''

func _exit_tree() -> void:
	shutdown_audio_players()


func shutdown_audio_players() -> void:
	for player in [music_player, ambience_player, sfx_player]:
		if player == null:
			continue
		player.stop()
		player.stream_paused = true
		player.stream = null
	music_player = null
	ambience_player = null
	sfx_player = null
	sfx_voices.clear()
'''
          path.write_text(source, encoding="utf-8")

      - name: Download and verify official Godot 4.6.2 editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin .godot-download
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output .godot-download/SHA512-SUMS.txt \
            "${GODOT_RELEASE_URL}/SHA512-SUMS.txt"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output ".godot-download/${GODOT_ARCHIVE}" \
            "${GODOT_RELEASE_URL}/${GODOT_ARCHIVE}"
          grep -F "  ${GODOT_ARCHIVE}" .godot-download/SHA512-SUMS.txt \
            > .godot-download/selected-SHA512-SUMS.txt
          (cd .godot-download && sha512sum --check selected-SHA512-SUMS.txt)
          unzip -q ".godot-download/${GODOT_ARCHIVE}" -d .godot-bin
          mv ".godot-bin/${GODOT_BINARY}" .godot-bin/godot
          chmod +x .godot-bin/godot
          [[ "$(.godot-bin/godot --version)" =~ ^4\.6\.2 ]]

      - name: Prove explicit audio teardown removes the ObjectDB leak
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/runtime-contract-audio-teardown.log"
          .godot-bin/godot --headless --verbose --path "$GITHUB_WORKSPACE" \
            --script res://tools/smoke_runtime_scene_contract.gd 2>&1 | tee "${log}"
          grep -F "Runtime scene contract smoke test passed" "${log}"
          if grep -F "ObjectDB instances leaked at exit" "${log}"; then
            echo "Explicit audio teardown did not remove the ObjectDB leak" >&2
            exit 1
          fi
