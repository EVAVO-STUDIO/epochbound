name: Apply Save State Studio type fix

on:
  push:
    branches:
      - work/save-state-studio-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Type validation counters explicitly
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/save-state-studio-foundation-20260729

      - name: Apply exact type fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("addons/epochbound_save_state_studio/save_state_studio.gd")
          source = path.read_text(encoding="utf-8")
          replacements = {
              'var error_count := errors_value.size() if typeof(errors_value) == TYPE_ARRAY else 0':
                  'var error_count: int = errors_value.size() if typeof(errors_value) == TYPE_ARRAY else 0',
              'var warning_count := warnings_value.size() if typeof(warnings_value) == TYPE_ARRAY else 0':
                  'var warning_count: int = warnings_value.size() if typeof(warnings_value) == TYPE_ARRAY else 0',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"Expected one occurrence of {old!r}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8", newline="\n")
          Path(".github/workflows/apply-save-state-type-fix.yml").unlink()

      - name: Commit parser fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons/epochbound_save_state_studio/save_state_studio.gd .github/workflows/apply-save-state-type-fix.yml
          git commit -m "fix: type State Studio validation counters"
          git push origin HEAD:work/save-state-studio-foundation-20260729
