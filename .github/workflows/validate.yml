name: Validate Godot Project

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: epochbound-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Godot 4.6.2 validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download official Godot 4.6.2 editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip"
          unzip -q godot.zip -d .godot-bin
          mv .godot-bin/Godot_v4.6.2-stable_linux.x86_64 .godot-bin/godot
          chmod +x .godot-bin/godot
          .godot-bin/godot --version

      - name: Import project and parse scripts
        shell: bash
        run: .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" --import

      - name: Validate campaign content
        shell: bash
        run: .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" --script res://tools/validate_content.gd
