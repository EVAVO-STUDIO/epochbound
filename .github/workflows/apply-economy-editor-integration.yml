name: Apply economy editor integration

on:
  push:
    branches:
      - work/merchant-economy-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Extend inherited editors for economy safety
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/merchant-economy-foundation-20260729

      - name: Apply exact editor changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected exactly one reviewed occurrence, found {count}: {old!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          # State Studio uses the final validator and exposes wallet and stock state.
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              'const EquipmentValidator = preload("res://src/content/equipment_validator.gd")\nconst EquipmentCatalog = preload("res://src/content/equipment_catalog.gd")\n',
              'const EquipmentValidator = preload("res://src/content/economy_validator.gd")\nconst EquipmentCatalog = preload("res://src/content/equipment_catalog.gd")\nconst EconomyCatalog = preload("res://src/content/economy_catalog.gd")\n'
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''var item_definitions: Dictionary = {}
          var quest_definitions: Dictionary = {}
          var slot_records: Dictionary = {}
          ''',
              '''var item_definitions: Dictionary = {}
          var quest_definitions: Dictionary = {}
          var currency_definitions: Dictionary = {}
          var merchant_definitions: Dictionary = {}
          var slot_records: Dictionary = {}
          '''
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''var inventory_list: ItemList
          var equipment_list: ItemList
          var quest_list: ItemList
          ''',
              '''var inventory_list: ItemList
          var equipment_list: ItemList
          var wallet_list: ItemList
          var merchant_stock_list: ItemList
          var quest_list: ItemList
          '''
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''\tequipment_list = ItemList.new()
          \tequipment_list.name = "Equipment"
          \tequipment_list.select_mode = ItemList.SELECT_SINGLE
          \ttabs.add_child(equipment_list)

          \tquest_list = ItemList.new()
          ''',
              '''\tequipment_list = ItemList.new()
          \tequipment_list.name = "Equipment"
          \tequipment_list.select_mode = ItemList.SELECT_SINGLE
          \ttabs.add_child(equipment_list)

          \twallet_list = ItemList.new()
          \twallet_list.name = "Wallet"
          \twallet_list.select_mode = ItemList.SELECT_SINGLE
          \ttabs.add_child(wallet_list)

          \tmerchant_stock_list = ItemList.new()
          \tmerchant_stock_list.name = "Merchant Stock"
          \tmerchant_stock_list.select_mode = ItemList.SELECT_SINGLE
          \ttabs.add_child(merchant_stock_list)

          \tquest_list = ItemList.new()
          '''
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''func load_definitions() -> void:
          \titem_definitions = {}
          \tquest_definitions = {}
          ''',
              '''func load_definitions() -> void:
          \titem_definitions = {}
          \tquest_definitions = {}
          \tcurrency_definitions = {}
          \tmerchant_definitions = {}
          '''
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''\tvar story_result: Dictionary = StoryCatalog.load_catalogs(active_campaign_path, active_campaign)
          \tif bool(story_result.get("ok", false)):
          \t\tquest_definitions = story_result.get("quests", {})
          ''',
              '''\tvar story_result: Dictionary = StoryCatalog.load_catalogs(active_campaign_path, active_campaign)
          \tif bool(story_result.get("ok", false)):
          \t\tquest_definitions = story_result.get("quests", {})
          \tvar economy_result: Dictionary = EconomyCatalog.load_catalogs(active_campaign_path, active_campaign)
          \tif bool(economy_result.get("ok", false)):
          \t\tcurrency_definitions = economy_result.get("currencies", {})
          \t\tmerchant_definitions = economy_result.get("merchants", {})
          '''
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              'var sections := profile_sections(profile, item_definitions, quest_definitions)',
              'var sections := profile_sections(profile, item_definitions, quest_definitions, currency_definitions, merchant_definitions)'
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''+ "[color=#8fa9a5]DURABLE STATE[/color]\\nInventory stacks  %d\\nEquipped slots  %d\\nActive quests  %d\\nCompleted quests  %d\\nState keys  %d\\n\\n" % [int(summary.get("inventory_stacks", 0)), int(summary.get("equipment_slots", 0)), int(summary.get("active_quests", 0)), int(summary.get("completed_quests", 0)), int(summary.get("state_keys", 0))]
          ''',
              '''+ "[color=#8fa9a5]DURABLE STATE[/color]\\nInventory stacks  %d\\nEquipped slots  %d\\nWallets  %d\\nMerchant records  %d\\nActive quests  %d\\nCompleted quests  %d\\nState keys  %d\\n\\n" % [int(summary.get("inventory_stacks", 0)), int(summary.get("equipment_slots", 0)), int(summary.get("currency_wallets", 0)), int(summary.get("merchant_records", 0)), int(summary.get("active_quests", 0)), int(summary.get("completed_quests", 0)), int(summary.get("state_keys", 0))]
          '''
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''\tif equipment_list.item_count == 0:
          \t\tequipment_list.add_item("No equipment is stored.")
          \tquest_list.clear()
          ''',
              '''\tif equipment_list.item_count == 0:
          \t\tequipment_list.add_item("No equipment is stored.")
          \twallet_list.clear()
          \tfor row_value in sections.get("wallet", []):
          \t\twallet_list.add_item(str(row_value))
          \tif wallet_list.item_count == 0:
          \t\twallet_list.add_item("No currency balances are stored.")
          \tmerchant_stock_list.clear()
          \tfor row_value in sections.get("merchant_stock", []):
          \t\tmerchant_stock_list.add_item(str(row_value))
          \tif merchant_stock_list.item_count == 0:
          \t\tmerchant_stock_list.add_item("No merchant stock is stored.")
          \tquest_list.clear()
          '''
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''static func profile_sections(
          \tprofile: Dictionary,
          \titems: Dictionary = {},
          \tquests: Dictionary = {}
          ) -> Dictionary:
          ''',
              '''static func profile_sections(
          \tprofile: Dictionary,
          \titems: Dictionary = {},
          \tquests: Dictionary = {},
          \tcurrencies: Dictionary = {},
          \tmerchants: Dictionary = {}
          ) -> Dictionary:
          '''
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''\tvar quest_rows: Array[String] = []
          \tvar progress_value: Variant = payload.get("quest_progress", {})
          ''',
              '''\tvar wallet_rows: Array[String] = []
          \tvar balances_value: Variant = payload.get("currency_balances", {})
          \tif typeof(balances_value) == TYPE_DICTIONARY:
          \t\tvar balances: Dictionary = balances_value
          \t\tvar currency_ids: Array[String] = []
          \t\tfor currency_key in balances.keys():
          \t\t\tcurrency_ids.append(str(currency_key))
          \t\tcurrency_ids.sort()
          \t\tfor currency_id in currency_ids:
          \t\t\twallet_rows.append("%s   %s %d   [%s]" % [EconomyCatalog.currency_name(currencies, currency_id), EconomyCatalog.currency_symbol(currencies, currency_id), int(balances.get(currency_id, 0)), currency_id])
          \tvar merchant_rows: Array[String] = []
          \tvar stock_value: Variant = payload.get("merchant_stock", {})
          \tif typeof(stock_value) == TYPE_DICTIONARY:
          \t\tvar stock: Dictionary = stock_value
          \t\tvar merchant_ids: Array[String] = []
          \t\tfor merchant_key in stock.keys():
          \t\t\tmerchant_ids.append(str(merchant_key))
          \t\tmerchant_ids.sort()
          \t\tfor merchant_id in merchant_ids:
          \t\t\tvar merchant_data := EconomyCatalog.merchant(merchants, merchant_id)
          \t\t\tvar merchant_name := str(merchant_data.get("display_name", merchant_id))
          \t\t\tvar merchant_state_value: Variant = stock.get(merchant_id, {})
          \t\t\tif typeof(merchant_state_value) != TYPE_DICTIONARY:
          \t\t\t\tcontinue
          \t\t\tvar merchant_state: Dictionary = merchant_state_value
          \t\t\tvar item_ids: Array[String] = []
          \t\t\tfor item_key in merchant_state.keys():
          \t\t\t\titem_ids.append(str(item_key))
          \t\t\titem_ids.sort()
          \t\t\tfor item_id in item_ids:
          \t\t\t\tvar item_name := ItemCatalog.item_name(ItemCatalog.item(items, item_id), item_id)
          \t\t\t\tvar quantity := int(merchant_state.get(item_id, 0))
          \t\t\t\tmerchant_rows.append("%s   %s   %s   [%s]" % [merchant_name, item_name, "UNLIMITED" if quantity < 0 else "x%d" % quantity, item_id])
          \tvar quest_rows: Array[String] = []
          \tvar progress_value: Variant = payload.get("quest_progress", {})
          '''
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              'return {"summary": summary, "inventory": inventory_rows, "equipment": equipment_rows, "quests": quest_rows, "state": state_rows}',
              'return {"summary": summary, "inventory": inventory_rows, "equipment": equipment_rows, "wallet": wallet_rows, "merchant_stock": merchant_rows, "quests": quest_rows, "state": state_rows}'
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''\titem_definitions = {}
          \tquest_definitions = {}
          \tslot_records = {}
          ''',
              '''\titem_definitions = {}
          \tquest_definitions = {}
          \tcurrency_definitions = {}
          \tmerchant_definitions = {}
          \tslot_records = {}
          '''
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''\tinventory_list.clear()
          \tequipment_list.clear()
          \tquest_list.clear()
          ''',
              '''\tinventory_list.clear()
          \tequipment_list.clear()
          \twallet_list.clear()
          \tmerchant_stock_list.clear()
          \tquest_list.clear()
          '''
          )

          # Loadout Studio validates against the final complete campaign contract.
          replace_once(
              "addons/epochbound_loadout_studio/loadout_studio.gd",
              'const EquipmentValidator = preload("res://src/content/equipment_validator.gd")',
              'const EquipmentValidator = preload("res://src/content/economy_validator.gd")'
          )

          # Item Forge protects merchant stock and refusal references from deletion.
          replace_once(
              "addons/epochbound_item_forge/item_forge_studio.gd",
              'const ObjectCatalog = preload("res://src/content/object_catalog.gd")\n',
              'const ObjectCatalog = preload("res://src/content/object_catalog.gd")\nconst EconomyCatalog = preload("res://src/content/economy_catalog.gd")\n'
          )
          replace_once(
              "addons/epochbound_item_forge/item_forge_studio.gd",
              '''\tfor map_data in campaign_maps():
          \t\tfor cue_value in map_data.get("companion_cues", []):
          \t\t\tif typeof(cue_value) != TYPE_DICTIONARY:
          \t\t\t\tcontinue
          \t\t\tvar cue: Dictionary = cue_value
          \t\t\tfor grant_value in ItemCatalog.item_grants(cue, "reward_items"):
          \t\t\t\tvar grant: Dictionary = grant_value
          \t\t\t\tif str(grant.get("item_id", "")) == item_id:
          \t\t\t\t\tusages.append("cue %s grant" % cue.get("id", "cue"))
          \treturn usages
          ''',
              '''\tfor map_data in campaign_maps():
          \t\tfor cue_value in map_data.get("companion_cues", []):
          \t\t\tif typeof(cue_value) != TYPE_DICTIONARY:
          \t\t\t\tcontinue
          \t\t\tvar cue: Dictionary = cue_value
          \t\t\tfor grant_value in ItemCatalog.item_grants(cue, "reward_items"):
          \t\t\t\tvar grant: Dictionary = grant_value
          \t\t\t\tif str(grant.get("item_id", "")) == item_id:
          \t\t\t\t\tusages.append("cue %s grant" % cue.get("id", "cue"))
          \tvar economy_result := EconomyCatalog.load_catalogs(active_campaign_path, active_campaign)
          \tvar merchants: Dictionary = economy_result.get("merchants", {})
          \tfor merchant_id in merchants.keys():
          \t\tvar merchant_data := EconomyCatalog.merchant(merchants, str(merchant_id))
          \t\tif EconomyCatalog.stock_entry_index(merchant_data).has(item_id):
          \t\t\tusages.append("merchant %s stock" % merchant_id)
          \t\tif EconomyCatalog.refused_items(merchant_data).has(item_id):
          \t\t\tusages.append("merchant %s refusal rule" % merchant_id)
          \treturn usages
          '''
          )

          Path(".github/workflows/apply-economy-editor-integration.yml").unlink()

      - name: Commit editor integration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: extend inherited editors for durable economy state"
          git push origin HEAD:work/merchant-economy-foundation-20260729
