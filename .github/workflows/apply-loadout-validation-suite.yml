name: Apply loadout validation suite

on:
  push:
    branches:
      - work/loadout-capability-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Extend inherited tests and validation runners
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/loadout-capability-foundation-20260729

      - name: Patch runtime expectations and validation runners
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_string: str, old: str, new: str) -> None:
              path = Path(path_string)
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path_string}: expected one occurrence, found {count}: {old[:120]!r}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "tools/smoke_encounters.gd",
              '''\t"res://src/story_runtime.gd",
          \t"res://src/save_runtime.gd"
          ''',
              '''\t"res://src/story_runtime.gd",
          \t"res://src/save_runtime.gd",
          \t"res://src/equipment_runtime.gd"
          ''',
          )
          replace_once(
              "tools/smoke_combat_director.gd",
              '''["res://src/combat_director_runtime.gd", "res://src/companion_runtime.gd", "res://src/inventory_runtime.gd", "res://src/story_runtime.gd", "res://src/save_runtime.gd"]''',
              '''["res://src/combat_director_runtime.gd", "res://src/companion_runtime.gd", "res://src/inventory_runtime.gd", "res://src/story_runtime.gd", "res://src/save_runtime.gd", "res://src/equipment_runtime.gd"]''',
          )
          replace_once(
              "tools/smoke_companion_director.gd",
              '''["res://src/companion_runtime.gd", "res://src/inventory_runtime.gd", "res://src/story_runtime.gd", "res://src/save_runtime.gd"]''',
              '''["res://src/companion_runtime.gd", "res://src/inventory_runtime.gd", "res://src/story_runtime.gd", "res://src/save_runtime.gd", "res://src/equipment_runtime.gd"]''',
          )
          replace_once(
              "tools/smoke_item_forge.gd",
              '''["res://src/inventory_runtime.gd", "res://src/story_runtime.gd", "res://src/save_runtime.gd"]''',
              '''["res://src/inventory_runtime.gd", "res://src/story_runtime.gd", "res://src/save_runtime.gd", "res://src/equipment_runtime.gd"]''',
          )
          replace_once(
              "tools/smoke_story_studio.gd",
              '''str((script_value as GDScript).resource_path) in ["res://src/story_runtime.gd", "res://src/save_runtime.gd"],''',
              '''str((script_value as GDScript).resource_path) in ["res://src/story_runtime.gd", "res://src/save_runtime.gd", "res://src/equipment_runtime.gd"],''',
          )
          replace_once(
              "tools/smoke_save_profiles.gd",
              '''str((script_value as GDScript).resource_path) == "res://src/save_runtime.gd",''',
              '''str((script_value as GDScript).resource_path) == "res://src/equipment_runtime.gd",''',
          )
          replace_once(
              "tools/smoke_save_profiles.gd",
              '''"Runtime scene must bind the save-aware runtime."''',
              '''"Runtime scene must bind the equipment-aware save runtime."''',
          )

          replace_once(
              ".github/workflows/validate.yml",
              '''      - name: Smoke test Save and State Studio inspector
          \        shell: bash
          \        run: |
          \          set -euo pipefail
          \          log_file="$(mktemp)"
          \          set +e
          \          timeout 60s .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" --script res://tools/smoke_save_state_studio.gd 2>&1 | tee "$log_file"
          \          godot_status=${PIPESTATUS[0]}
          \          set -e
          \          if [ "$godot_status" -ne 0 ]; then
          \            exit "$godot_status"
          \          fi
          \          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
          \            exit 1
          \          fi
          ''',
              '''      - name: Smoke test Save and State Studio inspector
          \        shell: bash
          \        run: |
          \          set -euo pipefail
          \          log_file="$(mktemp)"
          \          set +e
          \          timeout 60s .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" --script res://tools/smoke_save_state_studio.gd 2>&1 | tee "$log_file"
          \          godot_status=${PIPESTATUS[0]}
          \          set -e
          \          if [ "$godot_status" -ne 0 ]; then
          \            exit "$godot_status"
          \          fi
          \          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
          \            exit 1
          \          fi

          \      - name: Smoke test loadout stats capability gates and restoration
          \        shell: bash
          \        run: |
          \          set -euo pipefail
          \          log_file="$(mktemp)"
          \          set +e
          \          timeout 60s .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" --script res://tools/smoke_loadout_runtime.gd 2>&1 | tee "$log_file"
          \          godot_status=${PIPESTATUS[0]}
          \          set -e
          \          if [ "$godot_status" -ne 0 ]; then
          \            exit "$godot_status"
          \          fi
          \          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
          \            exit 1
          \          fi

          \      - name: Smoke test Loadout Studio editor state
          \        shell: bash
          \        run: |
          \          set -euo pipefail
          \          log_file="$(mktemp)"
          \          set +e
          \          timeout 60s .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" --script res://tools/smoke_loadout_studio.gd 2>&1 | tee "$log_file"
          \          godot_status=${PIPESTATUS[0]}
          \          set -e
          \          if [ "$godot_status" -ne 0 ]; then
          \            exit "$godot_status"
          \          fi
          \          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
          \            exit 1
          \          fi

          \      - name: Smoke test malformed equipment capabilities and gates
          \        shell: bash
          \        run: |
          \          set -euo pipefail
          \          log_file="$(mktemp)"
          \          set +e
          \          timeout 60s .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" --script res://tools/smoke_equipment_validation_edges.gd 2>&1 | tee "$log_file"
          \          godot_status=${PIPESTATUS[0]}
          \          set -e
          \          if [ "$godot_status" -ne 0 ]; then
          \            exit "$godot_status"
          \          fi
          \          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
          \            exit 1
          \          fi
          ''',
          )

          replace_once(
              "scripts/validate.ps1",
              '''    Invoke-GodotStep "Smoke test Save and State Studio inspector" @(
          \        "--headless", "--path", $ProjectRoot,
          \        "--script", "res://tools/smoke_save_state_studio.gd"
          \    )

          \    Write-Host "`nEpochbound project, campaign, world-model, encounter, Combat Director, Companion Studio, Item Forge, Story Studio and Save State validation passed."
          ''',
              '''    Invoke-GodotStep "Smoke test Save and State Studio inspector" @(
          \        "--headless", "--path", $ProjectRoot,
          \        "--script", "res://tools/smoke_save_state_studio.gd"
          \    )

          \    Invoke-GodotStep "Smoke test loadout stats capability gates and restoration" @(
          \        "--headless", "--path", $ProjectRoot,
          \        "--script", "res://tools/smoke_loadout_runtime.gd"
          \    )

          \    Invoke-GodotStep "Smoke test Loadout Studio editor state" @(
          \        "--headless", "--path", $ProjectRoot,
          \        "--script", "res://tools/smoke_loadout_studio.gd"
          \    )

          \    Invoke-GodotStep "Smoke test malformed equipment capabilities and gates" @(
          \        "--headless", "--path", $ProjectRoot,
          \        "--script", "res://tools/smoke_equipment_validation_edges.gd"
          \    )

          \    Write-Host "`nEpochbound project, campaign, world-model, encounter, Combat Director, Companion Studio, Item Forge, Story Studio, Save State and Loadout validation passed."
          ''',
          )

          Path(".github/workflows/apply-loadout-validation-suite.yml").unlink()

      - name: Commit extended validation suite
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/smoke_encounters.gd tools/smoke_combat_director.gd tools/smoke_companion_director.gd tools/smoke_item_forge.gd tools/smoke_story_studio.gd tools/smoke_save_profiles.gd .github/workflows/validate.yml scripts/validate.ps1 .github/workflows/apply-loadout-validation-suite.yml
          git commit -m "test: extend guarded validation through Loadout Studio"
          git push origin HEAD:work/loadout-capability-foundation-20260729
