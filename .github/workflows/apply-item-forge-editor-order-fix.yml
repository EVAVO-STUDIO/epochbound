name: Apply Item Forge editor ordering fix

on:
  push:
    branches:
      - work/item-forge-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Preserve authored recipe output selection
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/item-forge-foundation-20260729

      - name: Apply exact editor fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("addons/epochbound_item_forge/item_forge_studio.gd")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''func refresh_all_forms() -> void:
          \trefresh_item_list()
          \trefresh_recipe_list()
          \trefresh_item_selectors()
          \trefresh_starting_loadout()
          ''',
                  '''func refresh_all_forms() -> void:
          \trefresh_item_list()
          \trefresh_item_selectors()
          \trefresh_recipe_list()
          \trefresh_starting_loadout()
          ''',
              ),
              (
                  '''\tvar first_item_id := str(item_definitions.keys()[0])
          \tvar recipes: Array = active_recipe_catalog.get("recipes", [])
          ''',
                  '''\tvar item_ids := sorted_definition_ids(item_definitions, "display_name")
          \tvar first_item_id := item_ids[0]
          \tvar recipes: Array = active_recipe_catalog.get("recipes", [])
          ''',
              ),
          ]

          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"Expected one reviewed Item Forge block, found {source.count(old)}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8", newline="\n")
          Path(".github/workflows/apply-item-forge-editor-order-fix.yml").unlink()

      - name: Commit editor ordering fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons/epochbound_item_forge/item_forge_studio.gd .github/workflows/apply-item-forge-editor-order-fix.yml
          git commit -m "fix: preserve Item Forge recipe output selection"
          git push origin HEAD:work/item-forge-foundation-20260729
