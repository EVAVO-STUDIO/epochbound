name: Apply companion runtime smoke compatibility

on:
  push:
    branches:
      - work/companion-director-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Extend inherited runtime smoke expectations
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/companion-director-foundation-20260729

      - name: Apply exact compatibility transformations
        shell: python
        run: |
          from pathlib import Path

          encounter_path = Path("tools/smoke_encounters.gd")
          encounter = encounter_path.read_text(encoding="utf-8")
          old_paths = '''const COMBAT_RUNTIME_PATHS := [
          \t"res://src/combat_runtime.gd",
          \t"res://src/combat_director_runtime.gd"
          ]
          '''
          new_paths = '''const COMBAT_RUNTIME_PATHS := [
          \t"res://src/combat_runtime.gd",
          \t"res://src/combat_director_runtime.gd",
          \t"res://src/companion_runtime.gd"
          ]
          '''
          if encounter.count(old_paths) != 1:
              raise SystemExit("Base encounter runtime path list did not match reviewed source.")
          encounter_path.write_text(encounter.replace(old_paths, new_paths, 1), encoding="utf-8", newline="\n")

          combat_path = Path("tools/smoke_combat_director.gd")
          combat = combat_path.read_text(encoding="utf-8")
          old_check = '''\tif script_value is GDScript:
          \t\tcheck(
          \t\t\tstr((script_value as GDScript).resource_path) == "res://src/combat_director_runtime.gd",
          \t\t\t"Runtime scene must bind the Combat Director runtime."
          \t\t)
          '''
          new_check = '''\tif script_value is GDScript:
          \t\tvar runtime_path := str((script_value as GDScript).resource_path)
          \t\tcheck(
          \t\t\truntime_path in ["res://src/combat_director_runtime.gd", "res://src/companion_runtime.gd"],
          \t\t\t"Runtime scene must bind a Combat Director-capable runtime."
          \t\t)
          '''
          if combat.count(old_check) != 1:
              raise SystemExit("Combat Director runtime check did not match reviewed source.")
          combat_path.write_text(combat.replace(old_check, new_check, 1), encoding="utf-8", newline="\n")

          Path(".github/workflows/apply-companion-smoke-compat.yml").unlink()

      - name: Commit compatibility updates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/smoke_encounters.gd tools/smoke_combat_director.gd .github/workflows/apply-companion-smoke-compat.yml
          git commit -m "test: accept the companion runtime in inherited smoke tests"
          git push origin HEAD:work/companion-director-foundation-20260729
