name: Validate Godot Project

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: epochbound-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Godot 4.6.2 validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download official Godot 4.6.2 editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip"
          unzip -q godot.zip -d .godot-bin
          mv .godot-bin/Godot_v4.6.2-stable_linux.x86_64 .godot-bin/godot
          chmod +x .godot-bin/godot
          .godot-bin/godot --version

      - name: Compile runtime scenes and editor plugins
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          set +e
          timeout 60s .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" --script res://tools/compile_probe.gd 2>&1 | tee "$log_file"
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then
            exit "$godot_status"
          fi
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
            exit 1
          fi

      - name: Import project and reject hidden parser errors
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          set +e
          timeout 90s .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" --import 2>&1 | tee "$log_file"
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then
            exit "$godot_status"
          fi
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
            echo "Godot import emitted parser or resource errors."
            exit 1
          fi

      - name: Validate campaign content
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          set +e
          timeout 60s .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" --script res://tools/validate_content.gd 2>&1 | tee "$log_file"
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then
            exit "$godot_status"
          fi
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
            exit 1
          fi

      - name: Smoke test world model and traversal contracts
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          set +e
          timeout 60s .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" --script res://tools/smoke_world_model.gd 2>&1 | tee "$log_file"
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then
            exit "$godot_status"
          fi
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
            exit 1
          fi

      - name: Smoke test encounter catalogs placements and combat
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          set +e
          timeout 60s .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" --script res://tools/smoke_encounters.gd 2>&1 | tee "$log_file"
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then
            exit "$godot_status"
          fi
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
            exit 1
          fi

      - name: Smoke test encounter zones and directed combat
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          set +e
          timeout 60s .godot-bin/godot --headless --path "$GITHUB_WORKSPACE" --script res://tools/smoke_combat_director.gd 2>&1 | tee "$log_file"
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then
            exit "$godot_status"
          fi
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log_file"; then
            exit 1
          fi
