name: Apply economy validation patch from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'work/merchant-economy-foundation-20260729'
    runs-on: ubuntu-latest

    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: work/merchant-economy-foundation-20260729
          fetch-depth: 0

      - name: Execute reviewed non-workflow validation changes
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import textwrap

          # Three files were already applied directly through the connected app.
          # Restore their main versions so the reviewed patch remains one-shot and exact.
          subprocess.run(["git", "fetch", "origin", "main", "--depth=1"], check=True)
          subprocess.run([
              "git", "checkout", "origin/main", "--",
              "tools/compile_probe.gd",
              "tools/validate_content.gd",
              "tools/smoke_encounters.gd",
          ], check=True)

          source = Path('.github/workflows/apply-economy-validation-suite.yml').read_text(encoding='utf-8')
          source = source.replace(
              'item_count == 10, "Item Forge must display all ten reference items."',
              'item_count == 10, "Item Forge must display all ten reference inventory and equipment items."'
          )
          source = source.replace(
              'item_count == 11, "Item Forge must display all eleven reference items."',
              'item_count == 11, "Item Forge must display all eleven reference inventory and equipment items."'
          )
          source = source.replace(
              'item_count == 10, "Recipe output selector must contain every reference item."',
              'item_count == 10, "Recipe output selector must contain every reference inventory and equipment item."'
          )
          source = source.replace(
              'item_count == 11, "Recipe output selector must contain every reference item."',
              'item_count == 11, "Recipe output selector must contain every reference inventory and equipment item."'
          )
          source = source.replace(
              'Epochbound project, campaign, world-model, encounter, Combat Director, Companion Studio, Item Forge, Story Studio, Save & State Studio and Loadout Studio validation passed.',
              'Epochbound project, campaign, world-model, encounter, Combat Director, Companion Studio, Item Forge, Story Studio, Save State and Loadout validation passed.'
          )
          section = source.split('      - name: Apply exact regression updates', 1)[1]
          section = section.split('      - name: Commit validation suite', 1)[0]
          code = section.split('        run: |', 1)[1]
          exec(textwrap.dedent(code), {})

          # The Actions token cannot modify workflow files. Leave those three
          # paths untouched; the connected GitHub app applies them separately.
          subprocess.run([
              "git", "checkout", "HEAD", "--",
              ".github/workflows/validate.yml",
              ".github/workflows/apply-economy-validation-suite.yml",
              ".github/workflows/apply-economy-validation-pr.yml",
          ], check=True)

      - name: Commit non-workflow validation changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: extend regression coverage through merchant economy"
          git push origin HEAD:work/merchant-economy-foundation-20260729
