name: Apply loadout save inspector

on:
  push:
    branches:
      - work/loadout-capability-foundation-20260729

permissions:
  contents: write

jobs:
  patch:
    name: Extend profile construction and State inspector
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/loadout-capability-foundation-20260729

      - name: Apply equipment profile and inspector changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_string: str, old: str, new: str) -> None:
              path = Path(path_string)
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path_string}: expected one occurrence, found {count}: {old[:120]!r}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "src/content/save_profile.gd",
              '''static func build_profile(
          \tcampaign_id: String,
          \tslot_id: String,
          \tmetadata: Dictionary,
          \tpayload: Dictionary
          ) -> Dictionary:
          \tvar profile := {
          \t\t"schema_version": CURRENT_SCHEMA,
          \t\t"profile_id": "%s:%s" % [campaign_id, slot_id],
          \t\t"campaign_id": campaign_id,
          \t\t"slot_id": slot_id,
          \t\t"metadata": canonicalize(metadata),
          \t\t"payload": canonicalize(payload)
          \t}
          ''',
              '''static func build_profile(
          \tcampaign_id: String,
          \tslot_id: String,
          \tmetadata: Dictionary,
          \tpayload: Dictionary
          ) -> Dictionary:
          \tvar normalised_payload := payload.duplicate(true)
          \tif typeof(normalised_payload.get("equipment")) != TYPE_DICTIONARY:
          \t\tnormalised_payload["equipment"] = {}
          \tvar profile := {
          \t\t"schema_version": CURRENT_SCHEMA,
          \t\t"profile_id": "%s:%s" % [campaign_id, slot_id],
          \t\t"campaign_id": campaign_id,
          \t\t"slot_id": slot_id,
          \t\t"metadata": canonicalize(metadata),
          \t\t"payload": canonicalize(normalised_payload)
          \t}
          ''',
          )

          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''const SaveValidator = preload("res://src/content/save_validator.gd")
          const ItemCatalog = preload("res://src/content/item_catalog.gd")
          ''',
              '''const SaveValidator = preload("res://src/content/save_validator.gd")
          const EquipmentValidator = preload("res://src/content/equipment_validator.gd")
          const EquipmentCatalog = preload("res://src/content/equipment_catalog.gd")
          const ItemCatalog = preload("res://src/content/item_catalog.gd")
          ''',
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''var inventory_list: ItemList
          var quest_list: ItemList
          ''',
              '''var inventory_list: ItemList
          var equipment_list: ItemList
          var quest_list: ItemList
          ''',
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''\tinventory_list = ItemList.new()
          \tinventory_list.name = "Inventory"
          \tinventory_list.select_mode = ItemList.SELECT_SINGLE
          \ttabs.add_child(inventory_list)

          \tquest_list = ItemList.new()
          ''',
              '''\tinventory_list = ItemList.new()
          \tinventory_list.name = "Inventory"
          \tinventory_list.select_mode = ItemList.SELECT_SINGLE
          \ttabs.add_child(inventory_list)

          \tequipment_list = ItemList.new()
          \tequipment_list.name = "Equipment"
          \tequipment_list.select_mode = ItemList.SELECT_SINGLE
          \ttabs.add_child(equipment_list)

          \tquest_list = ItemList.new()
          ''',
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''\t\t+ "[color=#8fa9a5]DURABLE STATE[/color]\\nInventory stacks  %d\\nActive quests  %d\\nCompleted quests  %d\\nState keys  %d\\n\\n" % [int(summary.get("inventory_stacks", 0)), int(summary.get("active_quests", 0)), int(summary.get("completed_quests", 0)), int(summary.get("state_keys", 0))]
          ''',
              '''\t\t+ "[color=#8fa9a5]DURABLE STATE[/color]\\nInventory stacks  %d\\nEquipped slots  %d\\nActive quests  %d\\nCompleted quests  %d\\nState keys  %d\\n\\n" % [int(summary.get("inventory_stacks", 0)), int(summary.get("equipment_slots", 0)), int(summary.get("active_quests", 0)), int(summary.get("completed_quests", 0)), int(summary.get("state_keys", 0))]
          ''',
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''\tif inventory_list.item_count == 0:
          \t\tinventory_list.add_item("Inventory is empty.")
          \tquest_list.clear()
          ''',
              '''\tif inventory_list.item_count == 0:
          \t\tinventory_list.add_item("Inventory is empty.")
          \tequipment_list.clear()
          \tfor row_value in sections.get("equipment", []):
          \t\tequipment_list.add_item(str(row_value))
          \tif equipment_list.item_count == 0:
          \t\tequipment_list.add_item("No equipment is stored.")
          \tquest_list.clear()
          ''',
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''\tvar quest_rows: Array[String] = []
          \tvar progress_value: Variant = payload.get("quest_progress", {})
          ''',
              '''\tvar equipment_rows: Array[String] = []
          \tvar equipment_value: Variant = payload.get("equipment", {})
          \tif typeof(equipment_value) == TYPE_DICTIONARY:
          \t\tvar equipment: Dictionary = equipment_value
          \t\tvar slot_ids: Array[String] = []
          \t\tfor slot_key in equipment.keys():
          \t\t\tslot_ids.append(str(slot_key))
          \t\tslot_ids.sort()
          \t\tfor slot_id in slot_ids:
          \t\t\tvar item_id := str(equipment.get(slot_id, ""))
          \t\t\tvar definition_data := ItemCatalog.item(items, item_id)
          \t\t\tvar item_name := ItemCatalog.item_name(definition_data, item_id)
          \t\t\tequipment_rows.append("%s   %s   [%s]" % [slot_id.replace("_", " ").capitalize(), item_name, item_id])
          \tvar quest_rows: Array[String] = []
          \tvar progress_value: Variant = payload.get("quest_progress", {})
          ''',
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''\treturn {"summary": summary, "inventory": inventory_rows, "quests": quest_rows, "state": state_rows}
          ''',
              '''\treturn {"summary": summary, "inventory": inventory_rows, "equipment": equipment_rows, "quests": quest_rows, "state": state_rows}
          ''',
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''\tvar report: Dictionary = SaveValidator.validate_campaign_path(active_campaign_path)
          ''',
              '''\tvar report: Dictionary = EquipmentValidator.validate_campaign_path(active_campaign_path)
          ''',
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''\tvar report: Dictionary = SaveValidator.validate_profile(selected_profile, active_campaign_path)
          ''',
              '''\tvar report: Dictionary = EquipmentValidator.validate_profile(selected_profile, active_campaign_path)
          ''',
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''\tvar validation: Dictionary = SaveValidator.validate_profile(selected_profile, active_campaign_path)
          ''',
              '''\tvar validation: Dictionary = EquipmentValidator.validate_profile(selected_profile, active_campaign_path)
          ''',
          )
          replace_once(
              "addons/epochbound_save_state_studio/save_state_studio.gd",
              '''\tinventory_list.clear()
          \tquest_list.clear()
          ''',
              '''\tinventory_list.clear()
          \tequipment_list.clear()
          \tquest_list.clear()
          ''',
          )

          replace_once(
              "tools/smoke_save_state_studio.gd",
              '''\tvar inventory_list_value: Variant = studio.get("inventory_list")
          \tvar quest_list_value: Variant = studio.get("quest_list")
          ''',
              '''\tvar inventory_list_value: Variant = studio.get("inventory_list")
          \tvar equipment_list_value: Variant = studio.get("equipment_list")
          \tvar quest_list_value: Variant = studio.get("quest_list")
          ''',
          )
          replace_once(
              "tools/smoke_save_state_studio.gd",
              '''\tcheck(inventory_list_value is ItemList, "Save State Studio must create an inventory inspector.")
          \tcheck(quest_list_value is ItemList, "Save State Studio must create a quest inspector.")
          ''',
              '''\tcheck(inventory_list_value is ItemList, "Save State Studio must create an inventory inspector.")
          \tcheck(equipment_list_value is ItemList, "Save State Studio must create an equipment inspector.")
          \tcheck(quest_list_value is ItemList, "Save State Studio must create a quest inspector.")
          ''',
          )
          replace_once(
              "tools/smoke_save_state_studio.gd",
              '''\tif quest_list_value is ItemList:
          \t\tcheck((quest_list_value as ItemList).item_count == 1, "Quest inspector must expose stored quest progress.")
          ''',
              '''\tif equipment_list_value is ItemList:
          \t\tcheck((equipment_list_value as ItemList).item_count == 1, "Equipment inspector must expose the stored loadout.")
          \tif quest_list_value is ItemList:
          \t\tcheck((quest_list_value as ItemList).item_count == 1, "Quest inspector must expose stored quest progress.")
          ''',
          )
          replace_once(
              "tools/smoke_save_state_studio.gd",
              '''\tcheck((sections.get("inventory", []) as Array).size() == 2, "Static profile sections must expose inventory rows without editor state.")
          \tcheck((sections.get("quests", []) as Array).size() == 1, "Static profile sections must expose quest rows without editor state.")
          ''',
              '''\tcheck((sections.get("inventory", []) as Array).size() == 2, "Static profile sections must expose inventory rows without editor state.")
          \tcheck((sections.get("equipment", []) as Array).size() == 1, "Static profile sections must expose equipment rows without editor state.")
          \tcheck((sections.get("quests", []) as Array).size() == 1, "Static profile sections must expose quest rows without editor state.")
          ''',
          )
          replace_once(
              "tools/smoke_save_state_studio.gd",
              '''\t\t"quest_progress": {"the_missing_hour": {"status": "active", "stage_id": "trace_the_name"}},
          \t\t"companion_command": "follow",
          ''',
              '''\t\t"quest_progress": {"the_missing_hour": {"status": "active", "stage_id": "trace_the_name"}},
          \t\t"equipment": {"tool": "museum_flashlight"},
          \t\t"companion_command": "follow",
          ''',
          )

          Path(".github/workflows/apply-loadout-save-inspector.yml").unlink()

      - name: Commit equipment-aware State inspector
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/save_profile.gd addons/epochbound_save_state_studio/save_state_studio.gd tools/smoke_save_state_studio.gd .github/workflows/apply-loadout-save-inspector.yml
          git commit -m "feat: inspect equipment in durable save profiles"
          git push origin HEAD:work/loadout-capability-foundation-20260729
